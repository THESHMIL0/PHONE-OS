<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamer OS Pro</title>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: white; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }

        /* --- CONSOLE FRAME --- */
        .phone-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: linear-gradient(to bottom, #111, #222);
            border: 2px solid #0ff; /* Cyan glow */
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        
        /* --- STATUS BAR --- */
        .status-bar { 
            padding: 10px; display: flex; justify-content: space-between; 
            background: #111; border-bottom: 1px solid #333; color: #0ff; font-weight: bold;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #111; opacity: 1; z-index: 10; transition: 0.2s;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: 0; }
        
        .back-btn {
            position: absolute; top: 10px; left: 10px; z-index: 50;
            background: #333; color: #0ff; border: 1px solid #0ff;
            padding: 5px 15px; font-family: inherit; cursor: pointer;
        }

        /* --- HOME GRID --- */
        .app-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; width: 100%; }
        .game-card {
            background: #222; border: 1px solid #444; height: 120px; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 40px; color: #fff; cursor: pointer; transition: 0.1s;
        }
        .game-card:active { transform: scale(0.95); border-color: #0ff; background: #333; }
        .game-card span { font-size: 16px; margin-top: 10px; color: #aaa; }

        /* --- SPACE SHOOTER --- */
        #space-canvas { background: #000; border: 1px solid #333; margin-top: 20px; }
        .controls-row { display: flex; gap: 20px; margin-top: 10px; width: 100%; justify-content: center; }
        .ctrl-btn {
            width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 1px solid #555;
            border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { background: #0ff; color: black; }
        .fire-btn { border-color: #f00; color: #f00; }
        .fire-btn:active { background: #f00; color: white; }

        /* --- SETTINGS --- */
        .setting-row {
            width: 90%; padding: 15px; margin: 10px; background: #222; border: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; color: #fff;
        }
        .toggle { width: 40px; height: 20px; background: #444; border-radius: 10px; position: relative; }
        .toggle.on { background: #0ff; }
        .toggle-knob { width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; left: 1px; top: 1px; transition: 0.2s; }
        .toggle.on .toggle-knob { left: 21px; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar">
            <span>GAMER OS v7</span>
            <span>🔋 100%</span>
        </div>

        <div id="lock-screen" class="screen">
            <h1 style="color: #0ff; text-shadow: 0 0 10px #0ff; font-size: 40px;">SYSTEM LOCKED</h1>
            <input type="password" id="pass-input" maxlength="4" placeholder="____" style="background:transparent; border:none; border-bottom:2px solid #0ff; color:white; font-size:30px; text-align:center; width:100px; margin:20px;">
            <button onclick="unlock()" style="background:#0ff; border:none; padding:10px 30px; font-weight:bold;">LOGIN</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <div class="app-grid">
                <div class="game-card" onclick="openApp('space')">🚀<span>Galaxy War</span></div>
                <div class="game-card" onclick="openApp('snake')">🐍<span>Neon Snake</span></div>
                <div class="game-card" onclick="openApp('clicker')">💰<span>Tycoon</span></div>
                <div class="game-card" onclick="openApp('settings')">⚙️<span>System</span></div>
            </div>
        </div>

        <div id="space-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <div style="width:100%; display:flex; justify-content:space-between; padding:0 20px; margin-top:10px;">
                <span id="space-score">SCORE: 0</span>
                <span id="space-lives">❤️❤️❤️</span>
            </div>
            <canvas id="space-canvas" width="300" height="400"></canvas>
            <div class="controls-row">
                <button class="ctrl-btn" ontouchstart="moveShip(-1)" ontouchend="stopShip()">⬅️</button>
                <button class="ctrl-btn fire-btn" onclick="fireLaser()">🔥</button>
                <button class="ctrl-btn" ontouchstart="moveShip(1)" ontouchend="stopShip()">➡️</button>
            </div>
        </div>

        <div id="settings-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">BACK</button>
            <h2>SYSTEM CONFIG</h2>
            <div class="setting-row" onclick="toggleSetting('sound')">
                <span>🔊 Sound FX</span>
                <div id="btn-sound" class="toggle on"><div class="toggle-knob"></div></div>
            </div>
            <div class="setting-row" onclick="toggleSetting('vibro')">
                <span>📳 Haptic Feedback</span>
                <div id="btn-vibro" class="toggle on"><div class="toggle-knob"></div></div>
            </div>
        </div>

        <div id="snake-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">EXIT</button><h1>SNAKE (Loading...)</h1></div>
        <div id="clicker-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">EXIT</button><h1>TYCOON (Loading...)</h1></div>
    </div>
    <script>
        const PASS = "1234";
        let settings = { sound: true, vibro: true };
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- SYSTEM FUNCTIONS ---
        function unlock() {
            if(document.getElementById('pass-input').value === PASS) {
                playSound('startup');
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
            }
        }
        function goHome() {
            stopGameLoop();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('home-screen').classList.remove('hidden');
        }
        function openApp(app) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(app + '-screen').classList.remove('hidden');
            if(app === 'space') startSpaceGame();
        }

        // --- AUDIO ENGINE (No files needed!) ---
        function playSound(type) {
            if(!settings.sound) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if(type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } 
            else if(type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                if(settings.vibro) navigator.vibrate(200); // Vibrate phone
            }
            else if(type === 'startup') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function toggleSetting(key) {
            settings[key] = !settings[key];
            document.getElementById('btn-' + key).classList.toggle('on');
        }
        // --- SPACE SHOOTER LOGIC ---
        let ctx, ship, bullets, enemies, particles, gameLoop, score, frames;
        
        function startSpaceGame() {
            const canvas = document.getElementById('space-canvas');
            ctx = canvas.getContext('2d');
            ship = { x: 135, y: 360, w: 30, h: 30, dx: 0 };
            bullets = []; enemies = []; particles = [];
            score = 0; frames = 0;
            
            if(gameLoop) cancelAnimationFrame(gameLoop);
            updateSpace();
        }

        function moveShip(dir) { ship.dx = dir * 5; }
        function stopShip() { ship.dx = 0; }
        
        function fireLaser() {
            bullets.push({ x: ship.x + 12, y: ship.y, w: 6, h: 15, dy: -7 });
            playSound('shoot');
        }

        function updateSpace() {
            // Clear Screen
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 300, 400);
            
            // Move Ship
            ship.x += ship.dx;
            if(ship.x < 0) ship.x = 0;
            if(ship.x > 270) ship.x = 270;

            // Draw Ship
            ctx.fillStyle = "#0ff";
            ctx.beginPath(); ctx.moveTo(ship.x + 15, ship.y); ctx.lineTo(ship.x, ship.y + 30); ctx.lineTo(ship.x + 30, ship.y + 30); ctx.fill();

            // Bullets
            ctx.fillStyle = "#f00";
            bullets.forEach((b, i) => {
                b.y += b.dy;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                if(b.y < 0) bullets.splice(i, 1);
            });

            // Enemies
            if(frames % 60 === 0) {
                enemies.push({ x: Math.random() * 270, y: -30, w: 30, h: 30, dy: 2 });
            }
            
            enemies.forEach((e, i) => {
                e.y += e.dy;
                ctx.fillStyle = "#f0f"; // Pink Enemies
                ctx.fillRect(e.x, e.y, e.w, e.h);

                // Collision: Bullet hits Enemy
                bullets.forEach((b, bi) => {
                    if(b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(i, 1);
                        bullets.splice(bi, 1);
                        score += 100;
                        document.getElementById('space-score').innerText = "SCORE: " + score;
                        playSound('explosion');
                        createExplosion(e.x, e.y);
                    }
                });

                // Collision: Enemy hits Ship
                if(e.x < ship.x + ship.w && e.x + e.w > ship.x && e.y < ship.y + ship.h && e.y + e.h > ship.y) {
                    alert("GAME OVER! Score: " + score);
                    startSpaceGame();
                }
            });

            // Particles (Explosions)
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                ctx.fillStyle = `rgba(255, 165, 0, ${p.life/20})`;
                ctx.fillRect(p.x, p.y, 4, 4);
                if(p.life <= 0) particles.splice(i, 1);
            });

            frames++;
            gameLoop = requestAnimationFrame(updateSpace);
        }

        function createExplosion(x, y) {
            for(let i=0; i<10; i++) {
                particles.push({
                    x: x + 15, y: y + 15,
                    dx: (Math.random() - 0.5) * 5,
                    dy: (Math.random() - 0.5) * 5,
                    life: 20
                });
            }
        }

        function stopGameLoop() { cancelAnimationFrame(gameLoop); }
    </script>
</body>
</html>
