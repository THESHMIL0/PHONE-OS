<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-container">
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>
        
        <div id="lock-screen" class="screen">
            <h2>Enter Passcode</h2>
            <input type="password" id="pass-input" maxlength="4" placeholder="••••">
            <button onclick="checkPass()">Unlock</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <div class="app-grid">
                <div class="app-icon" onclick="launchGame('snake')">🐍</div>
                <div class="app-icon" onclick="launchGame('tic-tac-toe')">❌</div>
                <div class="app-icon" onclick="launchGame('clicker')">🖱️</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
