<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake App v6</title>
    <style>
        /* --- THEME VARIABLES --- */
        :root { --bg: #050505; --panel: #111; --primary: #0f0; --text: #fff; --danger: #f05; }
        
        /* SKINS (Defined here for preview logic) */
        body.skin-neon { --primary: #0f0; --glow: 0 0 10px #0f0; }
        body.skin-gold { --primary: #ffd700; --glow: 0 0 10px #ffaa00; }
        body.skin-ice { --primary: #00eaff; --glow: 0 0 10px #0088ff; }
        body.skin-void { --primary: #ff0000; --glow: 0 0 10px #880000; }
        body.skin-retro { --primary: #fff; --glow: none; }

        /* --- CORE SETUP --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            overflow: hidden; height: 100vh; width: 100vw; position: relative;
        }

        /* --- VISUALS --- */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }

        /* --- APP SCREENS --- */
        .app-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 10; padding: 20px;
        }
        .screen-hidden-left { transform: translateX(-100%); }
        .screen-hidden-right { transform: translateX(100%); }
        .screen-active { transform: translateX(0); z-index: 20; }

        /* --- MAIN MENU --- */
        .logo-area { margin-top: 60px; text-align: center; }
        .logo-main { font-size: 60px; font-weight: 900; font-style: italic; color: var(--primary); text-shadow: var(--glow); letter-spacing: -2px; margin: 0; }
        .logo-sub { font-size: 14px; letter-spacing: 4px; color: #888; text-transform: uppercase; }
        
        .menu-buttons { margin-top: auto; margin-bottom: 50px; width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn-play {
            width: 80%; padding: 20px; border-radius: 40px; border: none;
            background: var(--primary); color: #000; font-size: 24px; font-weight: 900;
            box-shadow: var(--glow); cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-play:active { transform: scale(0.96); }
        
        .icon-row { display: flex; gap: 20px; }
        .btn-icon {
            width: 60px; height: 60px; border-radius: 18px; background: var(--panel); border: 1px solid #333;
            color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.1s;
        }
        .btn-icon:active { transform: scale(0.9); border-color: var(--primary); color: var(--primary); }

        /* --- SHOP SCREEN --- */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 50px; margin-bottom: 20px; }
        .title-text { font-size: 20px; font-weight: bold; }
        .currency-badge { background: #222; padding: 5px 15px; border-radius: 20px; color: #ffd700; font-weight: bold; border: 1px solid #444; }
        
        .preview-box {
            width: 100%; height: 120px; background: #111; border-radius: 15px; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; overflow: hidden;
        }
        .skin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        .skin-card {
            background: #111; border-radius: 15px; padding: 15px; border: 2px solid #222;
            display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative;
        }
        .skin-card.active { border-color: var(--primary); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .skin-name { font-size: 14px; font-weight: bold; text-transform: uppercase; }
        .skin-price { font-size: 12px; color: #ffd700; }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* --- SETTINGS SCREEN --- */
        .settings-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .setting-item {
            background: #111; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222;
        }
        .toggle-switch {
            width: 50px; height: 26px; background: #333; border-radius: 13px; position: relative; transition: 0.3s;
        }
        .toggle-knob {
            width: 22px; height: 22px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.3s;
        }
        .active .toggle-switch { background: var(--primary); }
        .active .toggle-knob { transform: translateX(24px); }

        /* --- GAME UI --- */
        canvas { background: #000; border: 2px solid #333; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.5); margin-top: 10px; }
        .score-hud { font-size: 40px; font-weight: 900; color: rgba(255,255,255,0.1); position: absolute; top: 80px; z-index: 0; }
        .controls { margin-top: auto; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; z-index: 30; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 50%; border: 1px solid #333; }
        .btn { width: 55px; height: 55px; background: #222; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #444; color: var(--primary); }
        .btn:active { background: #333; transform: scale(0.95); border-color: var(--primary); }
        .ability-btn { position: absolute; bottom: 40px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #00eaff; color:#000; font-size: 24px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 0 15px #00eaff; }
        
        /* --- GAME OVER MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-visible { opacity: 1; pointer-events: all; }
        .modal-box { background: #151515; border: 1px solid #333; padding: 30px; border-radius: 20px; text-align: center; width: 80%; transform: scale(0.8); transition: 0.3s; }
        .modal-visible .modal-box { transform: scale(1); }
    </style>
</head>
<body class="skin-neon">
    <div class="scanlines"></div>

    <div id="screen-menu" class="app-screen screen-active">
        <div class="logo-area">
            <h1 class="logo-main">SNAKE</h1>
            <div class="logo-sub">APP EDITION</div>
        </div>
        
        <div class="menu-buttons">
            <button class="btn-play" onclick="nav('game')">
                <span>▶</span> PLAY
            </button>
            <div class="icon-row">
                <div class="btn-icon" onclick="nav('shop')">🎨</div>
                <div class="btn-icon" onclick="nav('settings')">⚙️</div>
            </div>
        </div>
        <div style="font-size: 10px; color: #444; margin-top: auto;">v6.0.0</div>
    </div>

    <div id="screen-shop" class="app-screen screen-hidden-right">
        <div class="top-bar">
            <div class="btn-icon" style="width:40px; height:40px; font-size:18px;" onclick="nav('menu')">←</div>
            <div class="title-text">SKIN STORE</div>
            <div class="currency-badge">🪙 <span id="shop-bits">0</span></div>
        </div>

        <div class="preview-box">
            <div style="display:flex; gap:2px; align-items:center;">
                <div style="width:20px; height:20px; background:var(--primary); box-shadow:var(--glow);"></div>
                <div style="width:18px; height:18px; background:var(--primary); opacity:0.8;"></div>
                <div style="width:16px; height:16px; background:var(--primary); opacity:0.6;"></div>
            </div>
            <div style="position:absolute; bottom:10px; font-size:10px; color:#555;">PREVIEW</div>
        </div>

        <div class="skin-grid" id="skin-grid">
            </div>
    </div>

    <div id="screen-settings" class="app-screen screen-hidden-right">
        <div class="top-bar">
            <div class="btn-icon" style="width:40px; height:40px; font-size:18px;" onclick="nav('menu')">←</div>
            <div class="title-text">SETTINGS</div>
            <div style="width:40px;"></div>
        </div>

        <div class="settings-list">
            <div class="setting-item" id="opt-sound" onclick="toggleSetting('sound')">
                <span>🔊 Sound Effects</span>
                <div class="toggle-switch"><div class="toggle-knob"></div></div>
            </div>
            <div class="setting-item" id="opt-vibro" onclick="toggleSetting('vibro')">
                <span>📳 Vibration</span>
                <div class="toggle-switch"><div class="toggle-knob"></div></div>
            </div>
            <div class="setting-item" onclick="resetData()" style="border-color:#522;">
                <span style="color:#f55;">⚠️ Reset Data</span>
            </div>
        </div>
    </div>

    <div id="screen-game" class="app-screen screen-hidden-right" style="padding:0; justify-content:flex-start;">
        <div class="top-bar" style="padding: 10px 20px; background:rgba(0,0,0,0.5);">
            <div class="btn-icon" style="width:40px; height:40px; font-size:18px;" onclick="quitGame()">✕</div>
            <div class="title-text" style="font-family:monospace; font-size:24px;" id="game-score">0</div>
            <div class="currency-badge">🪙 <span id="game-bits">0</span></div>
        </div>

        <div class="score-hud" id="bg-score">0</div>
        <canvas id="game-canvas" width="340" height="400"></canvas>

        <div class="controls">
            <div class="d-pad">
                <div></div><div class="btn" ontouchstart="input('UP')" onmousedown="input('UP')">▲</div><div></div>
                <div class="btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">◀</div>
                <div class="btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">▼</div>
                <div class="btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">▶</div>
            </div>
        </div>
        <div class="ability-btn" onclick="activateAbility()">⚡</div>
    </div>

    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-box">
            <h2 style="margin:0; font-size:30px; color:var(--primary);">GAME OVER</h2>
            <p style="color:#aaa; margin:10px 0;">SCORE: <span id="final-score" style="color:#fff;">0</span></p>
            <div style="background:#222; padding:10px; border-radius:10px; margin-bottom:20px;">
                Earned: <span id="final-bits" style="color:#ffd700;">+0</span> 🪙
            </div>
            <div class="btn-play" style="width:100%; font-size:18px; margin-bottom:10px;" onclick="restartGame()">PLAY AGAIN</div>
            <div class="btn-icon" style="width:100%; border-radius:30px; font-size:16px;" onclick="nav('menu'); hideModal()">MENU</div>
        </div>
    </div>
    <script>
        // --- DATA & CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = 17; // 340/20
        const GRID_H = 20; // 400/20
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Save Data
        let user = {
            bits: parseInt(localStorage.getItem('snake_bits')) || 0,
            skins: JSON.parse(localStorage.getItem('snake_skins')) || ['neon'],
            currentSkin: localStorage.getItem('snake_skin') || 'neon',
            settings: JSON.parse(localStorage.getItem('snake_settings')) || { sound: true, vibro: true }
        };

        const SKINS = {
            'neon': { name: 'Neon Green', price: 0, color: '#0f0' },
            'gold': { name: 'Midas Gold', price: 200, color: '#ffd700' },
            'ice':  { name: 'Cyber Ice',  price: 500, color: '#00eaff' },
            'void': { name: 'Red Void',   price: 1000, color: '#f00' },
            'retro':{ name: 'Classic BW', price: 100, color: '#fff' }
        };

        // Game State
        let snake=[], food={}, dir={x:0,y:0}, nextDir={x:0,y:0}, score=0;
        let gameLoop, isRunning=false, speed=130, slowMo=false;

        // --- NAVIGATION ---
        function nav(screenName) {
            // Hide all
            document.querySelectorAll('.app-screen').forEach(s => {
                s.classList.remove('screen-active');
                s.classList.add('screen-hidden-left'); // Move old to left
            });
            
            const target = document.getElementById('screen-' + screenName);
            target.classList.remove('screen-hidden-left', 'screen-hidden-right');
            target.classList.add('screen-active');

            if (screenName === 'shop') loadShop();
            if (screenName === 'game') startGame();
            if (screenName === 'settings') loadSettings();
            
            sfx('swish');
        }

        function hideModal() { document.getElementById('modal-gameover').classList.remove('modal-visible'); }

        // --- SHOP SYSTEM ---
        function loadShop() {
            document.getElementById('shop-bits').innerText = user.bits;
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = "";
            
            for (let id in SKINS) {
                let skin = SKINS[id];
                let owned = user.skins.includes(id);
                let active = user.currentSkin === id;
                
                let el = document.createElement('div');
                el.className = `skin-card ${active ? 'active' : ''}`;
                el.onclick = () => selectSkin(id);
                
                el.innerHTML = `
                    <div style="width:30px; height:30px; border-radius:50%; background:${skin.color}; box-shadow:0 0 10px ${skin.color}"></div>
                    <div class="skin-name" style="color:${skin.color}">${skin.name}</div>
                    ${owned ? (active ? '<span style="font-size:10px;">SELECTED</span>' : '') : `<div class="skin-price">${skin.price} 🪙</div>`}
                    ${!owned ? `<div class="lock-overlay">🔒</div>` : ''}
                `;
                grid.appendChild(el);
            }
            applyTheme(user.currentSkin); // Preview
        }

        function selectSkin(id) {
            if (user.skins.includes(id)) {
                user.currentSkin = id;
                saveData();
                loadShop();
                sfx('tap');
            } else {
                if (user.bits >= SKINS[id].price) {
                    if(confirm(`Buy ${SKINS[id].name} for ${SKINS[id].price}?`)) {
                        user.bits -= SKINS[id].price;
                        user.skins.push(id);
                        user.currentSkin = id;
                        saveData();
                        loadShop();
                        sfx('buy');
                    }
                } else {
                    alert("Need more bits!");
                }
            }
        }

        function applyTheme(id) { document.body.className = `skin-${id}`; }

        // --- SETTINGS ---
        function loadSettings() {
            updateToggle('sound', user.settings.sound);
            updateToggle('vibro', user.settings.vibro);
        }
        function toggleSetting(key) {
            user.settings[key] = !user.settings[key];
            updateToggle(key, user.settings[key]);
            saveData();
            sfx('tap');
        }
        function updateToggle(id, val) {
            const el = document.getElementById('opt-'+id);
            if(val) el.classList.add('active'); else el.classList.remove('active');
        }
        function resetData() {
            if(confirm("Reset all progress?")) { localStorage.clear(); location.reload(); }
        }

        // --- DATA ---
        function saveData() {
            localStorage.setItem('snake_bits', user.bits);
            localStorage.setItem('snake_skins', JSON.stringify(user.skins));
            localStorage.setItem('snake_skin', user.currentSkin);
            localStorage.setItem('snake_settings', JSON.stringify(user.settings));
        }

        // --- GAME ENGINE ---
        function startGame() {
            hideModal();
            applyTheme(user.currentSkin);
            snake = [{x:8, y:10}, {x:8, y:11}, {x:8, y:12}];
            dir = {x:0, y:-1}; nextDir = {x:0, y:-1};
            score = 0; speed = 120;
            document.getElementById('game-score').innerText = 0;
            document.getElementById('bg-score').innerText = 0;
            document.getElementById('game-bits').innerText = user.bits;
            spawnFood();
            
            if(audioCtx.state === 'suspended') audioCtx.resume();
            isRunning = true;
            loop();
        }

        function loop() {
            if(!isRunning) return;
            update();
            draw();
            setTimeout(loop, slowMo ? 300 : speed);
        }

        function update() {
            dir = nextDir;
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Collisions
            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H || checkSelf(head)) {
                return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                if(score > 0 && score % 5 === 0 && speed > 60) speed -= 5;
                document.getElementById('game-score').innerText = score;
                document.getElementById('bg-score').innerText = score;
                sfx('eat');
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function checkSelf(h) {
            for(let p of snake) if(p.x === h.x && p.y === h.y) return true;
            return false;
        }

        function draw() {
            // Clear
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.fillRect(0,0,canvas.width, canvas.height);

            // Food
            let fc = getComputedStyle(document.body).getPropertyValue('--primary');
            ctx.fillStyle = "#ff0055"; // Food always red-ish contrast
            ctx.shadowBlur = 15; ctx.shadowColor = "#ff0055";
            ctx.beginPath(); ctx.arc(food.x*BOX+10, food.y*BOX+10, 7, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            ctx.fillStyle = fc;
            snake.forEach((p,i)=>{
                if(i===0) { ctx.fillStyle="#fff"; ctx.shadowBlur=15; ctx.shadowColor=fc; }
                else { ctx.fillStyle=fc; ctx.shadowBlur=0; }
                ctx.fillRect(p.x*BOX+1, p.y*BOX+1, 18, 18);
            });
        }

        function spawnFood() {
            food = {x: Math.floor(Math.random()*GRID_W), y: Math.floor(Math.random()*GRID_H)};
            for(let p of snake) if(p.x===food.x && p.y===food.y) spawnFood();
        }

        function gameOver() {
            isRunning = false;
            sfx('die');
            if(user.settings.vibro) navigator.vibrate(200);
            
            user.bits += score;
            saveData();
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-bits').innerText = "+" + score;
            document.getElementById('modal-gameover').classList.add('modal-visible');
        }

        function quitGame() { isRunning = false; nav('menu'); }
        function restartGame() { hideModal(); startGame(); }

        // --- CONTROLS & ABILITY ---
        function input(d) {
            if(d==='UP' && dir.y!==1) nextDir={x:0, y:-1};
            if(d==='DOWN' && dir.y!==-1) nextDir={x:0, y:1};
            if(d==='LEFT' && dir.x!==1) nextDir={x:-1, y:0};
            if(d==='RIGHT' && dir.x!==-1) nextDir={x:1, y:0};
        }
        
        function activateAbility() {
            if(slowMo || !isRunning) return;
            slowMo = true;
            document.body.style.filter = "saturation(0)"; // Visual FX
            sfx('buy');
            setTimeout(()=>{
                slowMo = false;
                document.body.style.filter = "none";
            }, 3000);
        }

        // Swipe
        let tX=0, tY=0;
        document.body.addEventListener('touchstart', e=>{tX=e.touches[0].clientX; tY=e.touches[0].clientY;}, {passive:false});
        document.body.addEventListener('touchend', e=>{
            let dX = e.changedTouches[0].clientX - tX, dY = e.changedTouches[0].clientY - tY;
            if(Math.abs(dX)>Math.abs(dY)) input(dX>0?'RIGHT':'LEFT'); else input(dY>0?'DOWN':'UP');
        }, {passive:false});

        // --- SFX ---
        function sfx(type) {
            if(!user.settings.sound) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            
            if (type === 'eat') { osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(1000, t+0.1); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); }
            else if (type === 'die') { osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(50, t+0.5); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'tap') { osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05); }
            else if (type === 'swish') { osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(100, t+0.2); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.2); }
            
            osc.start(t); osc.stop(t+0.5);
        }
    </script>
</body>
</html>
