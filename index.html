<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v2.0</title>
    <style>
        /* --- VARIABLES & SKINS --- */
        :root {
            --bg: #050505;
            --grid: #111;
            --snake: #0f0;
            --glow: #0f0;
            --food: #ff0055;
            --text: #fff;
        }
        /* Skin Classes */
        body.skin-neon { --snake: #0f0; --glow: #0f0; --food: #ff0055; }
        body.skin-cyber { --snake: #00eaff; --glow: #00eaff; --food: #ff00ff; }
        body.skin-gold { --snake: #ffd700; --glow: #ffd700; --food: #fff; }
        body.skin-toxic { --snake: #8a2be2; --glow: #8a2be2; --food: #ccff00; }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s;
        }

        /* --- BACKGROUND GRID --- */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 20px 20px; z-index: -1; opacity: 0.5;
        }

        /* --- HEADER --- */
        .header {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(20,20,20,0.9); border-bottom: 2px solid #333; z-index: 100;
            position: absolute; top: 0; left: 0; backdrop-filter: blur(5px);
        }
        .score-box { font-size: 24px; font-weight: 800; color: var(--text); }
        .score-val { color: var(--snake); text-shadow: 0 0 10px var(--glow); }
        
        /* --- CANVAS --- */
        #game-container {
            position: relative; margin-top: 40px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); border-radius: 12px;
        }
        canvas { 
            background: rgba(0,0,0,0.8); border: 2px solid #333; border-radius: 12px; 
            image-rendering: pixelated; display: block;
        }

        /* --- CONTROLS --- */
        .controls-area { margin-top: 25px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; 
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 50%; border: 1px solid #333;
        }
        .btn { 
            width: 60px; height: 60px; background: #222; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; font-size: 28px; 
            border: 2px solid #444; box-shadow: 0 4px 0 #111; transition: 0.05s; color: var(--snake);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #111; border-color: var(--snake); background: #333; }
        .btn-hidden { visibility: hidden; }

        /* --- MENUS & OVERLAYS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        .menu-box { 
            text-align: center; width: 85%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        h1 { font-size: 40px; margin: 0; color: var(--snake); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px var(--glow); font-style: italic; }
        
        .main-btn {
            background: var(--snake); color: #000; border: none; padding: 15px 50px; 
            font-size: 22px; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 25px var(--glow); margin-top: 20px; text-transform: uppercase;
        }
        .skin-btn {
            background: transparent; border: 2px solid #555; color: #888; padding: 8px 15px;
            margin: 5px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        .skin-btn.active { border-color: var(--snake); color: var(--text); background: rgba(255,255,255,0.1); }

        .shaking { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body class="skin-neon">

    <div class="header">
        <div class="score-box">
            <span class="score-val" id="score">0</span>
        </div>
        <div class="score-box" style="font-size: 14px; opacity: 0.7;">
            BEST: <span id="high-score">0</span>
        </div>
    </div>

    <div id="start-overlay" class="overlay">
        <div class="menu-box">
            <h1>SNAKE v2</h1>
            <p style="color:#aaa; margin-bottom: 30px;">SWIPE OR TAP TO MOVE</p>
            
            <button class="main-btn" onclick="startGame()">PLAY</button>
            
            <div style="margin-top: 40px;">
                <p style="font-size: 12px; letter-spacing: 1px;">SELECT SKIN</p>
                <button class="skin-btn active" onclick="setSkin('neon', this)">NEON</button>
                <button class="skin-btn" onclick="setSkin('cyber', this)">CYBER</button>
                <button class="skin-btn" onclick="setSkin('gold', this)">GOLD</button>
                <button class="skin-btn" onclick="setSkin('toxic', this)">TOXIC</button>
            </div>
        </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <div class="menu-box">
            <h1 style="color: #ff4444; text-shadow: none;">CRASHED!</h1>
            <h2 id="final-score" style="font-size: 50px; margin: 10px 0;">0</h2>
            <button class="main-btn" onclick="startGame()">RETRY</button>
            <button class="skin-btn" style="margin-top:20px; border:none;" onclick="showHome()">MENU</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="340" height="340"></canvas>
    </div>

    <div class="controls-area">
        <div class="d-pad">
            <div class="btn btn-hidden"></div>
            <div class="btn" ontouchstart="input('UP')" onmousedown="input('UP')">⬆️</div>
            <div class="btn btn-hidden"></div>
            
            <div class="btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">⬅️</div>
            <div class="btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">⬇️</div>
            <div class="btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">➡️</div>
        </div>
    </div>
    <script>
        // --- CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = canvas.width / BOX;
        const GRID_H = canvas.height / BOX;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- GAME STATE ---
        let snake = [];
        let food = {};
        let direction = {x:0, y:0};
        let inputQueue = []; // FIX: Prevents self-collision on fast turns
        let score = 0;
        let gameLoop;
        let gameSpeed = 120;
        let particles = [];

        // --- SKINS ---
        function setSkin(name, btn) {
            document.body.className = 'skin-' + name;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            sfx('move');
        }

        // --- CONTROLS ---
        function input(dir) {
            const lastInput = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : direction;
            
            // LOGIC FIX: Don't allow 180 degree turns based on the LAST QUEUED input, not current direction
            if (dir === 'UP' && lastInput.y === 0) inputQueue.push({x: 0, y: -1});
            if (dir === 'DOWN' && lastInput.y === 0) inputQueue.push({x: 0, y: 1});
            if (dir === 'LEFT' && lastInput.x === 0) inputQueue.push({x: -1, y: 0});
            if (dir === 'RIGHT' && lastInput.x === 0) inputQueue.push({x: 1, y: 0});
            
            sfx('move');
        }

        // Swipe Handling
        let tX = 0, tY = 0;
        document.body.addEventListener('touchstart', e => { tX = e.changedTouches[0].screenX; tY = e.changedTouches[0].screenY; }, {passive: false});
        document.body.addEventListener('touchend', e => {
            let dX = e.changedTouches[0].screenX - tX;
            let dY = e.changedTouches[0].screenY - tY;
            if (Math.abs(dX) > Math.abs(dY)) { input(dX > 0 ? 'RIGHT' : 'LEFT'); } 
            else { input(dY > 0 ? 'DOWN' : 'UP'); }
        }, {passive: false});

        // --- GAME LOOP ---
        function startGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('high-score').innerText = localStorage.getItem('snakeHigh') || 0;
            
            // Reset
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            direction = {x: 1, y: 0};
            inputQueue = [];
            score = 0;
            gameSpeed = 120;
            document.getElementById('score').innerText = 0;
            spawnFood();
            
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
            sfx('start');
        }

        function showHome() {
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('start-overlay').classList.remove('hidden');
        }

        function spawnFood() {
            food = { x: Math.floor(Math.random() * GRID_W), y: Math.floor(Math.random() * GRID_H) };
            // Recursion if food spawns on snake body
            for(let part of snake) { if(part.x === food.x && part.y === food.y) spawnFood(); }
        }

        function update() {
            // Process Input Queue (1 move per frame)
            if (inputQueue.length > 0) {
                direction = inputQueue.shift();
            }

            let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall Collision
            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H || checkSelfCollision(head)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                sfx('eat');
                spawnParticles(head.x * BOX, head.y * BOX);
                spawnFood();
                
                // Increase Speed (Logic Upgrade)
                if (gameSpeed > 60) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function checkSelfCollision(head) {
            for (let part of snake) { if (head.x === part.x && head.y === part.y) return true; }
            return false;
        }

        function draw() {
            // Clear
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Particles
            drawParticles();

            // Draw Food (Pulsing)
            let pulse = Math.sin(Date.now() / 100) * 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = getComputedStyle(document.body).getPropertyValue('--food');
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--food');
            ctx.fillRect(food.x * BOX + 2 - pulse/2, food.y * BOX + 2 - pulse/2, BOX - 4 + pulse, BOX - 4 + pulse);
            ctx.shadowBlur = 0;

            // Draw Snake
            let snakeColor = getComputedStyle(document.body).getPropertyValue('--snake');
            let glowColor = getComputedStyle(document.body).getPropertyValue('--glow');
            
            snake.forEach((part, index) => {
                ctx.fillStyle = snakeColor;
                if (index === 0) { // Head
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = glowColor;
                    ctx.fillStyle = "#fff"; // White center for head
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(part.x * BOX + 1, part.y * BOX + 1, BOX - 2, BOX - 2);
            });
        }

        // --- EFFECTS ---
        function spawnParticles(x, y) {
            for(let i=0; i<10; i++) {
                particles.push({x: x+10, y: y+10, dx: (Math.random()-0.5)*10, dy: (Math.random()-0.5)*10, life: 1});
            }
        }
        function drawParticles() {
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.life -= 0.05;
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--glow');
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            sfx('die');
            document.body.classList.add('shaking');
            setTimeout(() => document.body.classList.remove('shaking'), 300);
            
            let best = localStorage.getItem('snakeHigh') || 0;
            if (score > best) { best = score; localStorage.setItem('snakeHigh', best); }
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-overlay').classList.remove('hidden');
        }

        // --- SYNTH AUDIO (No files needed) ---
        function sfx(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            
            if (type === 'eat') {
                osc.frequency.setValueAtTime(600, t); osc.frequency.linearRampToValueAtTime(1000, t+0.1);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.1);
                osc.start(t); osc.stop(t+0.1);
            } else if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, t);
                gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05);
                osc.start(t); osc.stop(t+0.05);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.5);
                gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t+0.5);
                osc.start(t); osc.stop(t+0.5);
            } else if (type === 'start') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.3);
                gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.3);
                osc.start(t); osc.stop(t+0.3);
            }
        }
    </script>
</body>
</html>
