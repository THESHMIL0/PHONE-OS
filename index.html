<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Neon Snake</title>
    <style>
        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; background: #050505; color: white; font-family: 'Courier New', monospace; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- VISUALS --- */
        body::after { /* CRT SCANLINE */
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            z-index: 999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }
        
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
        .shaking { animation: shake 0.3s; }

        /* --- UI HEADER --- */
        .header {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(20,20,20,0.9); border-bottom: 2px solid #333; z-index: 100;
            position: absolute; top: 0; left: 0;
        }
        .score-box { font-size: 20px; font-weight: bold; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .high-score { font-size: 12px; color: #888; }

        /* --- GAME BOARD --- */
        #game-container {
            position: relative; margin-top: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1); border-radius: 12px;
        }
        canvas { 
            background: #000; border: 4px solid #333; border-radius: 12px; 
            image-rendering: pixelated; display: block;
        }

        /* --- CONTROLS --- */
        .controls-area {
            margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;
        }
        
        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 50%; border: 2px solid #333;
        }
        .btn { 
            width: 65px; height: 65px; background: #222; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; font-size: 30px; 
            border: 2px solid #444; box-shadow: 0 5px 0 #111; transition: 0.05s; color: #0f0;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #111; border-color: #0f0; background: #333; }
        .btn-hidden { visibility: hidden; }

        .turbo-toggle {
            padding: 8px 20px; border: 1px solid #333; border-radius: 20px; 
            font-size: 14px; color: #555; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .turbo-on { color: red; border-color: red; text-shadow: 0 0 10px red; }

        /* --- OVERLAY --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .hidden { display: none !important; }
        
        .msg-box { 
            background: #1a1a1a; border: 2px solid #0f0; padding: 30px; border-radius: 20px; 
            text-align: center; width: 80%; box-shadow: 0 0 50px rgba(0,255,0,0.2);
        }
        h1 { margin: 0 0 10px 0; color: #0f0; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #fff; font-size: 18px; margin-bottom: 20px; }
        .play-btn {
            background: #0f0; color: #000; border: none; padding: 15px 40px; 
            font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px #0f0; text-transform: uppercase;
        }
        .play-btn:active { transform: scale(0.95); }
        
        .hint { color: #666; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="score-box">SCORE: <span id="score">0</span></div>
            <div class="high-score">BEST: <span id="high-score">0</span></div>
        </div>
        <div id="turbo-btn" class="turbo-toggle" onclick="toggleTurbo()">TURBO OFF</div>
    </div>

    <div id="overlay">
        <div class="msg-box">
            <h1 id="overlay-title">NEON SNAKE</h1>
            <p id="overlay-msg">Ready?</p>
            <button class="play-btn" onclick="startGame()">PLAY</button>
            <div class="hint">SWIPE or USE BUTTONS to move</div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="340" height="340"></canvas>
    </div>

    <div class="controls-area">
        <div class="d-pad">
            <div class="btn btn-hidden"></div>
            <div class="btn" ontouchstart="setDir('UP')" onmousedown="setDir('UP')">⬆️</div>
            <div class="btn btn-hidden"></div>
            
            <div class="btn" ontouchstart="setDir('LEFT')" onmousedown="setDir('LEFT')">⬅️</div>
            <div class="btn" ontouchstart="setDir('DOWN')" onmousedown="setDir('DOWN')">⬇️</div>
            <div class="btn" ontouchstart="setDir('RIGHT')" onmousedown="setDir('RIGHT')">➡️</div>
        </div>
    </div>

    <script>
        // --- CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20; // Grid size
        const COLS = canvas.width / BOX;
        const ROWS = canvas.height / BOX;

        // --- STATE ---
        let snake = [];
        let food = {};
        let velocity = {x:0, y:0};
        let nextVelocity = {x:0, y:0}; // Buffer for inputs
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isTurbo = false;
        let isGameOver = false;
        let particles = [];
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- INIT ---
        document.getElementById('high-score').innerText = highScore;
        
        // --- INPUT HANDLING (SWIPE) ---
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.body.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.body.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
        }, {passive: false});

        function handleSwipe(dx, dy) {
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal
                if (dx > 30) setDir('RIGHT');
                if (dx < -30) setDir('LEFT');
            } else {
                // Vertical
                if (dy > 30) setDir('DOWN');
                if (dy < -30) setDir('UP');
            }
        }

        // --- GAME LOGIC ---
        function startGame() {
            document.getElementById('overlay').classList.add('hidden');
            snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
            velocity = {x: 1, y: 0};
            nextVelocity = {x: 1, y: 0};
            score = 0;
            document.getElementById('score').innerText = 0;
            isGameOver = false;
            spawnFood();
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, isTurbo ? 60 : 100);
            
            // Resume Audio Context if needed
            if (audioCtx.state === 'suspended') audioCtx.resume();
            sfx('start');
        }

        function setDir(dir) {
            // Prevent 180 turns (Death by own neck)
            if (dir === 'UP' && velocity.y === 0) nextVelocity = {x: 0, y: -1};
            if (dir === 'DOWN' && velocity.y === 0) nextVelocity = {x: 0, y: 1};
            if (dir === 'LEFT' && velocity.x === 0) nextVelocity = {x: -1, y: 0};
            if (dir === 'RIGHT' && velocity.x === 0) nextVelocity = {x: 1, y: 0};
            sfx('move');
        }

        function toggleTurbo() {
            isTurbo = !isTurbo;
            const btn = document.getElementById('turbo-btn');
            if (isTurbo) {
                btn.classList.add('turbo-on');
                btn.innerText = "TURBO ON";
                if(!isGameOver) { clearInterval(gameLoop); gameLoop = setInterval(update, 60); }
            } else {
                btn.classList.remove('turbo-on');
                btn.innerText = "TURBO OFF";
                if(!isGameOver) { clearInterval(gameLoop); gameLoop = setInterval(update, 100); }
            }
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
            // Ensure food doesn't spawn on snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) spawnFood();
            }
        }

        function update() {
            // Apply buffered input
            velocity = {...nextVelocity};

            // Move Head
            let head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Wall Collision
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
            }

            // Self Collision
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat Food
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                sfx('eat');
                createParticles(head.x * BOX + BOX/2, head.y * BOX + BOX/2);
                spawnFood();
                // Don't pop tail, snake grows
            } else {
                snake.pop();
            }

            draw();
        }

        // --- DRAWING ---
        function draw() {
            // Clear Screen
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Particles
            drawParticles();

            // Draw Food
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(food.x * BOX + BOX/2, food.y * BOX + BOX/2, BOX/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snake
            snake.forEach((part, index) => {
                // Head is brighter
                if (index === 0) {
                    ctx.fillStyle = "#0f0";
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = "#0f0";
                } else {
                    ctx.fillStyle = "#00aa00";
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(part.x * BOX + 1, part.y * BOX + 1, BOX - 2, BOX - 2);
            });
        }

        // --- PARTICLES FX ---
        function createParticles(x, y) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 8,
                    dy: (Math.random() - 0.5) * 8,
                    life: 1.0
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.1;
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = "gold";
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- GAME OVER ---
        function gameOver() {
            clearInterval(gameLoop);
            isGameOver = true;
            sfx('die');
            document.body.classList.add('shaking');
            setTimeout(() => document.body.classList.remove('shaking'), 300);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('high-score').innerText = highScore;
            }

            document.getElementById('overlay-title').innerText = "GAME OVER";
            document.getElementById('overlay-msg').innerText = "Final Score: " + score;
            document.getElementById('overlay').classList.remove('hidden');
        }

        // --- AUDIO SYNTH ---
        function sfx(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'start') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }
    </script>
</body>
</html>
