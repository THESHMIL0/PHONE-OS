<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v14 Stable</title>
    <style>
        /* --- VARIABLES --- */
        :root { --bg: #050505; --panel: #111; --primary: #0f0; --accent: #00eaff; --text: #fff; }
        
        body.skin-neon { --primary: #0f0; --glow: 0 0 15px rgba(0,255,0,0.5); }
        body.skin-gold { --primary: #ffd700; --glow: 0 0 15px rgba(255,215,0,0.5); }
        body.skin-ice { --primary: #00eaff; --glow: 0 0 15px rgba(0,234,255,0.5); }
        body.skin-void { --primary: #ff0000; --glow: 0 0 15px rgba(255,0,0,0.5); }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; font-family: 'Courier New', monospace; }
        body { 
            margin: 0; background: #000; color: var(--text); 
            overflow: hidden; height: 100vh; width: 100vw; 
            display: flex; align-items: center; justify-content: center;
        }

        /* --- DEVICE FRAME --- */
        .device-frame {
            width: 100%; height: 100%; max-width: 500px; background: var(--bg);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        
        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); transition: transform 0.3s ease;
            z-index: 10; padding: 10px;
        }
        .screen-active { transform: translateX(0); z-index: 20; }
        .screen-hidden { transform: translateX(100%); z-index: 0; }
        .screen-left { transform: translateX(-100%); z-index: 0; }

        /* --- UI ELEMENTS --- */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 50px; padding: 0 10px; }
        .currency { background: #222; padding: 5px 15px; border-radius: 20px; color: #ffd700; font-weight: bold; border: 1px solid #444; }
        
        .logo { font-size: 50px; font-weight: 900; color: var(--primary); text-shadow: var(--glow); margin-top: 40px; margin-bottom: 10px; }
        
        .btn-main {
            width: 80%; padding: 15px; border-radius: 30px; border: 2px solid var(--primary);
            background: rgba(0,255,0,0.1); color: #fff; font-size: 20px; font-weight: bold;
            box-shadow: var(--glow); cursor: pointer; text-transform: uppercase; margin: 10px 0;
        }
        .btn-main:active { background: var(--primary); color: #000; }

        .nav-grid { display: flex; gap: 20px; margin-top: 20px; }
        .nav-icon { width: 60px; height: 60px; background: #222; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #444; }
        .nav-icon:active { border-color: var(--primary); color: var(--primary); }

        /* --- GAME CANVAS --- */
        #game-area {
            position: relative; width: 100%; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        canvas { 
            background: #111; border: 2px solid #333; border-radius: 10px; 
            width: 95vw; height: 95vw; max-width: 350px; max-height: 350px; /* RESPONSIVE FIX */
            image-rendering: pixelated; 
        }

        /* --- HUD --- */
        .hud { width: 100%; max-width: 350px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .score-display { font-size: 30px; font-weight: bold; color: var(--primary); text-shadow: var(--glow); }
        .combo-bar { width: 100%; max-width: 350px; height: 5px; background: #222; margin-bottom: 10px; border-radius: 5px; overflow: hidden; }
        .combo-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0, #f00); transition: width 0.1s; }

        /* --- CONTROLS --- */
        .controls { 
            width: 100%; padding: 20px; background: #111; border-top: 2px solid #222; 
            display: flex; justify-content: center; position: relative; z-index: 50;
            transition: transform 0.3s ease;
        }
        .controls-hidden { transform: translateY(100%); }

        .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #000; padding: 10px; border-radius: 50%; border: 1px solid #333; }
        .d-btn { width: 50px; height: 50px; background: #222; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid #444; color: var(--primary); }
        .d-btn:active { background: #333; transform: scale(0.9); border-color: var(--primary); }
        
        .ability-btn { 
            position: absolute; right: 20px; top: -30px; width: 60px; height: 60px; 
            border-radius: 50%; background: var(--accent); color: #000; font-size: 24px; 
            display: flex; align-items: center; justify-content: center; border: 3px solid #fff; 
            box-shadow: 0 0 15px var(--accent);
        }
        .ability-btn.cooldown { filter: grayscale(1); opacity: 0.5; }

        /* --- MODAL --- */
        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal.visible { opacity: 1; pointer-events: all; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid #333; text-align: center; width: 80%; }

        /* --- SHOP --- */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        .shop-card { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        .shop-card.active { border-color: var(--primary); background: #0a2a0a; }

        /* FX */
        .float-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 5px #000; font-size: 20px; z-index: 60; }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-40px); } }
    </style>
</head>
<body class="skin-neon">
    <div class="device-frame">
        
        <div id="screen-menu" class="screen screen-active">
            <div class="top-bar">
                <div style="font-size:12px; color:#666;">v14.0 STABLE</div>
                <div class="currency">🪙 <span id="menu-bits">0</span></div>
            </div>

            <div class="logo">SNAKE</div>
            <div style="color:#aaa; margin-bottom: 40px; letter-spacing: 2px;">ARCADE</div>

            <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <button class="btn-main" onclick="startGame('endless')">∞ ENDLESS</button>
                <button class="btn-main" style="border-color:#00eaff; color:#00eaff;" onclick="nav('levels')">🗺️ CAMPAIGN</button>
                
                <div class="nav-grid">
                    <div class="nav-icon" onclick="nav('shop')">🛒</div>
                    <div class="nav-icon" onclick="nav('settings')">⚙️</div>
                    <div class="nav-icon" style="color:#ffd700;" onclick="claimDaily()" id="daily-btn">🎁</div>
                </div>
            </div>
        </div>

        <div id="screen-game" class="screen screen-hidden">
            <div class="top-bar">
                <div class="nav-icon" style="width:35px; height:35px;" onclick="pauseGame()">ll</div>
                <div style="font-size:12px; color:#888;" id="game-mode-text">ENDLESS</div>
                <div class="currency">🪙 <span id="game-bits">0</span></div>
            </div>

            <div id="game-area">
                <div class="hud">
                    <div>SCORE</div>
                    <div class="score-display" id="score">0</div>
                </div>
                <div class="combo-bar"><div class="combo-fill" id="combo-bar"></div></div>
                
                <canvas id="game-canvas" width="400" height="400"></canvas>
                <div id="fx-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
            </div>
        </div>

        <div id="screen-shop" class="screen screen-hidden">
            <div class="top-bar">
                <div class="nav-icon" style="width:40px; height:40px;" onclick="nav('menu')">←</div>
                <div>SKIN SHOP</div>
                <div class="currency">🪙 <span id="shop-bits">0</span></div>
            </div>
            <div id="shop-grid" class="shop-grid"></div>
        </div>

        <div id="screen-levels" class="screen screen-hidden">
            <div class="top-bar">
                <div class="nav-icon" style="width:40px; height:40px;" onclick="nav('menu')">←</div>
                <div>CAMPAIGN</div>
                <div></div>
            </div>
            <div id="level-grid" class="shop-grid"></div>
        </div>

        <div id="controls" class="controls controls-hidden">
            <div class="d-pad">
                <div></div><div class="d-btn" ontouchstart="input('UP', event)" onmousedown="input('UP', event)">▲</div><div></div>
                <div class="d-btn" ontouchstart="input('LEFT', event)" onmousedown="input('LEFT', event)">◀</div>
                <div class="d-btn" ontouchstart="input('DOWN', event)" onmousedown="input('DOWN')">▼</div>
                <div class="d-btn" ontouchstart="input('RIGHT', event)" onmousedown="input('RIGHT', event)">▶</div>
            </div>
            <div id="ability-btn" class="ability-btn" onclick="activateAbility()">⏳</div>
        </div>

        <div id="modal-gameover" class="modal">
            <div class="modal-content">
                <h1 style="color:#f00; margin:0;">GAME OVER</h1>
                <p>SCORE: <span id="final-score" style="color:#fff; font-weight:bold;">0</span></p>
                <button class="btn-main" onclick="restartGame()">RETRY</button>
                <button class="nav-icon" style="width:100%; margin-top:10px;" onclick="nav('menu'); hideModal()">MENU</button>
            </div>
        </div>

    </div>
    <script>
        // --- SETUP ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        // Fixed grid size logic
        const GRID_SIZE = 20; 
        const TILE_COUNT = 20; // 20x20 grid = 400x400 logical size
        
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- DATA ---
        let user = {
            bits: parseInt(localStorage.getItem('snake_bits')) || 0,
            skins: JSON.parse(localStorage.getItem('snake_skins')) || ['neon'],
            skin: localStorage.getItem('snake_skin') || 'neon',
            level: parseInt(localStorage.getItem('snake_level')) || 1,
            lastDaily: parseInt(localStorage.getItem('snake_daily')) || 0
        };

        const SKINS = {
            'neon': { name: 'Neon', price: 0, color: '#0f0' },
            'gold': { name: 'Gold', price: 200, color: '#ffd700' },
            'ice':  { name: 'Ice',  price: 500, color: '#00eaff' },
            'void': { name: 'Void', price: 1000, color: '#f00' }
        };

        const LEVELS = [
            { id: 1, target: 5, walls: [] },
            { id: 2, target: 10, walls: [{x:5,y:5}, {x:6,y:5}, {x:14,y:14}, {x:13,y:14}] },
            { id: 3, target: 20, walls: [{x:9,y:9}, {x:9,y:10}, {x:10,y:9}, {x:10,y:10}] }, // Center Box
            { id: 4, target: 30, walls: [{x:0,y:5}, {x:1,y:5}, {x:2,y:5}, {x:19,y:15}, {x:18,y:15}] }
        ];

        // --- GAME VARIABLES ---
        let snake = [], food = {}, walls = [];
        let vel = {x:0, y:0};
        let inputQueue = [];
        let score = 0, speed = 150, isRunning = false;
        let gameLoopId, mode = 'endless', target = 0;
        let combo = 1, comboTimer = 0;
        let safeTime = 0; // Invincibility frames

        // --- INIT ---
        window.onload = () => { updateUI(); checkDaily(); };

        function updateUI() {
            document.getElementById('menu-bits').innerText = user.bits;
            document.body.className = `skin-${user.skin}`;
        }

        function nav(screen) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('screen-active');
                s.classList.add('screen-hidden');
            });
            // Show target
            let targetScreen = document.getElementById('screen-'+screen);
            targetScreen.classList.remove('screen-hidden');
            targetScreen.classList.add('screen-active');

            // Handle Controls Visibility
            let controls = document.getElementById('controls');
            if (screen === 'game') controls.classList.remove('controls-hidden');
            else controls.classList.add('controls-hidden');

            if (screen === 'shop') loadShop();
            if (screen === 'levels') loadLevels();
            if (screen === 'menu') updateUI();
        }

        // --- GAME START ---
        function startGame(selectedMode, levelId) {
            nav('game');
            hideModal();
            
            // Reset State
            snake = [{x:10, y:10}, {x:10, y:11}, {x:10, y:12}];
            vel = {x:0, y:-1}; // Moving UP
            inputQueue = [];
            score = 0; combo = 1; speed = 130;
            safeTime = 5; // 5 frames of safety
            isRunning = true;
            mode = selectedMode;

            // Mode Config
            walls = [];
            target = 0;
            if (mode === 'campaign') {
                let lvl = LEVELS.find(l => l.id === levelId);
                walls = lvl.walls;
                target = lvl.target;
                document.getElementById('game-mode-text').innerText = "LEVEL " + levelId;
            } else {
                document.getElementById('game-mode-text').innerText = "ENDLESS";
            }

            document.getElementById('score').innerText = 0;
            document.getElementById('game-bits').innerText = user.bits;
            
            spawnFood();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            if(gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(loop, speed);
        }

        function loop() {
            if(!isRunning) return;

            // Input Handling
            if (inputQueue.length > 0) {
                let next = inputQueue.shift();
                if (next.x !== -vel.x && next.y !== -vel.y) vel = next;
            }

            // Movement
            let head = { x: snake[0].x + vel.x, y: snake[0].y + vel.y };

            // Collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT || checkCollision(head)) {
                if (safeTime > 0) {
                    // Wall Bounce logic for safety (Keep snake inside)
                    head.x = Math.max(0, Math.min(TILE_COUNT-1, head.x));
                    head.y = Math.max(0, Math.min(TILE_COUNT-1, head.y));
                } else {
                    return gameOver(false);
                }
            }

            snake.unshift(head);

            // Eat
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                sfx('eat');
                comboTimer = 20; // Reset combo bar
                spawnFood();
                if(target > 0 && score >= target) return gameOver(true);
            } else {
                snake.pop();
            }

            // Timers
            if (safeTime > 0) safeTime--;
            if (comboTimer > 0) {
                comboTimer--;
                document.getElementById('combo-bar').style.width = (comboTimer * 5) + "%";
            }

            draw();
        }

        function checkCollision(head) {
            // Self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            // Walls
            for (let w of walls) {
                if (head.x === w.x && head.y === w.y) return true;
            }
            return false;
        }

        function draw() {
            // Clear
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Walls
            ctx.fillStyle = "#333";
            for(let w of walls) {
                ctx.fillRect(w.x * 20, w.y * 20, 18, 18);
            }

            // Food
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 15; ctx.shadowColor = "#f05";
            ctx.beginPath(); 
            ctx.arc(food.x * 20 + 10, food.y * 20 + 10, 8, 0, Math.PI*2); 
            ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            let color = getComputedStyle(document.body).getPropertyValue('--primary');
            ctx.fillStyle = color;
            snake.forEach((p, i) => {
                if (i===0) { ctx.fillStyle = "#fff"; ctx.shadowBlur = 10; ctx.shadowColor = color; }
                else { ctx.fillStyle = color; ctx.shadowBlur = 0; }
                ctx.fillRect(p.x * 20 + 1, p.y * 20 + 1, 18, 18);
            });
        }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
                valid = true;
                for(let p of snake) if(p.x === food.x && p.y === food.y) valid = false;
                for(let w of walls) if(w.x === food.x && w.y === food.y) valid = false;
            }
        }

        function gameOver(win) {
            isRunning = false;
            clearInterval(gameLoopId);
            sfx(win ? 'powerup' : 'die');
            
            if (win && mode === 'campaign') {
                if (user.level < LEVELS.length) user.level++;
            }
            user.bits += score;
            saveData();

            document.getElementById('final-score').innerText = score;
            document.getElementById('modal-gameover').classList.add('modal-visible');
        }

        function restartGame() {
            if (mode === 'campaign') startGame('campaign', user.level); // Retry current level? Or last played? Actually retry implies same settings.
            else startGame('endless');
        }

        function pauseGame() {
            isRunning = !isRunning;
            if(!isRunning) alert("PAUSED");
        }

        // --- SHOP & LEVELS ---
        function loadLevels() {
            nav('levels');
            const grid = document.getElementById('level-grid'); grid.innerHTML = "";
            LEVELS.forEach(lvl => {
                let locked = lvl.id > user.level;
                let el = document.createElement('div');
                el.className = 'shop-card';
                el.style.opacity = locked ? 0.5 : 1;
                el.innerHTML = `<div>LEVEL ${lvl.id}</div><div style="font-size:10px;">${locked?'🔒':'GOAL: '+lvl.target}</div>`;
                if(!locked) el.onclick = () => startGame('campaign', lvl.id);
                grid.appendChild(el);
            });
        }

        function loadShop() {
            nav('shop');
            document.getElementById('shop-bits').innerText = user.bits;
            const grid = document.getElementById('shop-grid'); grid.innerHTML = "";
            for (let k in SKINS) {
                let s = SKINS[k], owned = user.skins.includes(k);
                let el = document.createElement('div');
                el.className = 'shop-card';
                if(user.skin===k) el.classList.add('active');
                el.onclick = () => {
                    if(owned) { user.skin = k; saveData(); loadShop(); sfx('tap'); }
                    else if(user.bits >= s.price) {
                        if(confirm("Buy "+s.name+"?")) {
                            user.bits -= s.price; user.skins.push(k); user.skin = k; saveData(); loadShop(); sfx('buy');
                        }
                    }
                };
                el.innerHTML = `<div style="color:${s.color};font-weight:bold;">${s.name}</div><div>${owned ? 'OWNED' : s.price+' 🪙'}</div>`;
                grid.appendChild(el);
            }
        }

        // --- UTILS ---
        function input(d, e) {
            if(e) e.preventDefault();
            let newVel = {x:0, y:0};
            if(d==='UP') newVel = {x:0, y:-1};
            if(d==='DOWN') newVel = {x:0, y:1};
            if(d==='LEFT') newVel = {x:-1, y:0};
            if(d==='RIGHT') newVel = {x:1, y:0};
            
            // Prevent 180 (Simple check + queue safety)
            if (newVel.x !== -vel.x && newVel.y !== -vel.y) {
                inputQueue.push(newVel);
                // Apply immediately if queue is empty to reduce lag
                if(inputQueue.length === 1) vel = newVel; 
            }
        }
        
        function saveData() {
            localStorage.setItem('snake_bits', user.bits);
            localStorage.setItem('snake_skins', JSON.stringify(user.skins));
            localStorage.setItem('snake_skin', user.skin);
            localStorage.setItem('snake_level', user.level);
            localStorage.setItem('snake_daily', user.lastDaily);
        }

        function hideModal() { document.getElementById('modal-gameover').classList.remove('modal-visible'); }
        function claimDaily() {
            if(Date.now() - user.lastDaily > 86400000) {
                user.bits += 100; user.lastDaily = Date.now(); saveData(); checkDaily(); alert("+100 Bits!"); updateUI();
            }
        }
        function checkDaily() {
            let btn = document.getElementById('daily-btn');
            btn.style.opacity = (Date.now() - user.lastDaily > 86400000) ? 1 : 0.3;
        }

        function sfx(t) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if(t==='eat') o.frequency.value=600; 
            else if(t==='die') { o.type='sawtooth'; o.frequency.value=100; }
            else if(t==='start') { o.type='square'; o.frequency.value=400; }
            o.start(); setTimeout(()=>o.stop(), 100);
        }
    </script>
</body>
</html>
