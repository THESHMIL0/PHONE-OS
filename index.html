<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Snake v3</title>
    <style>
        /* --- VARIABLES --- */
        :root { --bg: #050505; --grid: #111; --snake: #0f0; --glow: #0f0; --food: #f05; --text: #fff; }
        
        /* SKINS */
        body.skin-neon { --snake: #0f0; --glow: #0f0; --food: #f05; }
        body.skin-gold { --snake: #ffd700; --glow: #ffaa00; --food: #fff; --bg: #100500; }
        body.skin-amour { --snake: #ff69b4; --glow: #ff1493; --food: #f00; --bg: #1a0505; --grid: #2a0505; }
        body.skin-retro { --snake: #fff; --glow: transparent; --food: #fff; --bg: #000; --grid: transparent; font-family: monospace; }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            transition: background 0.5s;
        }

        /* --- BACKGROUND FX --- */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }

        /* --- UI HEADER --- */
        .header {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100; border-bottom: 1px solid #333;
        }
        .score-box { text-align: center; }
        .score-big { font-size: 28px; font-weight: 900; color: var(--snake); text-shadow: 0 0 15px var(--glow); }
        .score-label { font-size: 10px; opacity: 0.7; letter-spacing: 1px; }
        
        .pause-btn {
            width: 40px; height: 40px; border: 2px solid #555; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
        }

        /* --- GAME AREA --- */
        #game-wrapper {
            position: relative; margin-top: 20px; z-index: 10;
            padding: 5px; border: 2px solid #333; border-radius: 16px; background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        canvas { display: block; border-radius: 12px; }

        /* --- MENUS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 0.2s; backdrop-filter: blur(10px);
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        .menu-title { font-size: 40px; font-weight: 900; font-style: italic; color: var(--snake); text-shadow: 0 0 20px var(--glow); margin-bottom: 10px; }
        
        .skin-selector { display: flex; gap: 10px; margin: 20px 0; }
        .skin-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #555; cursor: pointer; transition: 0.2s; }
        .skin-dot.active { transform: scale(1.2); border-color: #fff; box-shadow: 0 0 15px currentColor; }

        .btn-main {
            background: var(--snake); color: #000; border: none; padding: 15px 50px; 
            font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px var(--glow); margin-top: 20px; text-transform: uppercase;
        }
        .btn-main:active { transform: scale(0.95); }

        /* --- CONTROLS --- */
        .controls { 
            margin-top: auto; margin-bottom: 30px; width: 100%; 
            display: flex; flex-direction: column; align-items: center; z-index: 20; 
        }
        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 50%; border: 1px solid #333;
        }
        .d-btn { 
            width: 60px; height: 60px; background: #222; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            border: 2px solid #444; box-shadow: 0 4px 0 #111; transition: 0.05s; color: var(--snake);
        }
        .d-btn:active { transform: translateY(4px); box-shadow: none; background: #333; }
        
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
        .shaking { animation: shake 0.3s; }
    </style>
</head>
<body class="skin-neon">
    <div class="scanlines"></div>

    <div class="header">
        <div class="score-box" style="text-align: left;">
            <div class="score-label">SCORE</div>
            <div class="score-big" id="score">0</div>
        </div>
        <div class="pause-btn" onclick="togglePause()">⏸</div>
        <div class="score-box" style="text-align: right;">
            <div class="score-label">BEST</div>
            <div class="score-big" id="high-score" style="color:#fff; text-shadow:none; font-size:20px;">0</div>
        </div>
    </div>

    <div id="menu-overlay" class="overlay">
        <div class="menu-title">SNAKE v3</div>
        <p style="color:#aaa; font-size:14px; margin-bottom:20px;">SUPER CHARGED EDITION</p>
        
        <div style="color:#fff; font-size:12px; letter-spacing:1px;">SELECT SKIN</div>
        <div class="skin-selector">
            <div class="skin-dot active" style="background:#0f0;" onclick="setSkin('neon', this)"></div>
            <div class="skin-dot" style="background:#ffd700;" onclick="setSkin('gold', this)"></div>
            <div class="skin-dot" style="background:#ff69b4;" onclick="setSkin('amour', this)"></div>
            <div class="skin-dot" style="background:#fff;" onclick="setSkin('retro', this)"></div>
        </div>

        <button class="btn-main" onclick="startGame()">PLAY</button>
    </div>

    <div id="pause-overlay" class="overlay hidden" style="background:rgba(0,0,0,0.6);">
        <h1 style="color:white; font-size:40px;">PAUSED</h1>
        <button class="btn-main" style="background:#fff; color:#000; box-shadow:none;" onclick="togglePause()">RESUME</button>
        <button onclick="endGame()" style="margin-top:20px; background:none; border:1px solid #555; color:#aaa; padding:10px 20px; border-radius:20px;">QUIT</button>
    </div>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="340" height="340"></canvas>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div>
            <div class="d-btn" ontouchstart="input('UP')" onmousedown="input('UP')">▲</div>
            <div></div>
            <div class="d-btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">◀</div>
            <div class="d-btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">▼</div>
            <div class="d-btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">▶</div>
        </div>
    </div>
    <script>
        // --- CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = 17; // 340 / 20
        const GRID_H = 17;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- STATE ---
        let snake = [];
        let food = {x:0, y:0, type:'normal'}; // Types: normal, gold
        let dir = {x:0, y:0};
        let nextDir = {x:0, y:0};
        let score = 0;
        let speed = 150;
        let lastTime = 0;
        let isPaused = false;
        let isRunning = false;
        let particles = [];
        let skin = 'neon';

        // --- SETUP ---
        document.getElementById('high-score').innerText = localStorage.getItem('snakeHigh') || 0;

        function setSkin(name, el) {
            document.body.className = 'skin-' + name;
            skin = name;
            document.querySelectorAll('.skin-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            sfx('tap');
        }

        function startGame() {
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            snake = [{x:8, y:8}, {x:8, y:9}, {x:8, y:10}];
            dir = {x:0, y:-1};
            nextDir = {x:0, y:-1};
            score = 0;
            speed = 130; // Starting speed
            document.getElementById('score').innerText = 0;
            spawnFood();
            
            if(audioCtx.state === 'suspended') audioCtx.resume();
            isRunning = true;
            isPaused = false;
            lastTime = 0;
            requestAnimationFrame(gameLoop);
            sfx('start');
        }

        function togglePause() {
            if(!isRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').classList.toggle('hidden');
            if(!isPaused) {
                lastTime = 0;
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            isRunning = false;
            document.getElementById('menu-overlay').classList.remove('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
        }

        // --- CONTROLS ---
        function input(d) {
            // Queue logic to prevent accidental 180s
            const goingUp = dir.y === -1;
            const goingDown = dir.y === 1;
            const goingLeft = dir.x === -1;
            const goingRight = dir.x === 1;

            if (d === 'UP' && !goingDown) nextDir = {x:0, y:-1};
            if (d === 'DOWN' && !goingUp) nextDir = {x:0, y:1};
            if (d === 'LEFT' && !goingRight) nextDir = {x:-1, y:0};
            if (d === 'RIGHT' && !goingLeft) nextDir = {x:1, y:0};
            
            if(isRunning && !isPaused) sfx('move');
        }

        // Swipe logic
        let tX=0, tY=0;
        document.body.addEventListener('touchstart', e=>{tX=e.touches[0].clientX; tY=e.touches[0].clientY;}, {passive:false});
        document.body.addEventListener('touchend', e=>{
            let dX = e.changedTouches[0].clientX - tX;
            let dY = e.changedTouches[0].clientY - tY;
            if(Math.abs(dX) > Math.abs(dY)) input(dX > 0 ? 'RIGHT' : 'LEFT');
            else input(dY > 0 ? 'DOWN' : 'UP');
        }, {passive:false});

        // --- ENGINE ---
        function gameLoop(timestamp) {
            if(!isRunning || isPaused) return;
            
            if (timestamp - lastTime > speed) {
                update();
                lastTime = timestamp;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            dir = nextDir;
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Walls
            if(head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H) return gameOver();
            // Self
            for(let p of snake) if(head.x === p.x && head.y === p.y) return gameOver();

            snake.unshift(head);

            // Eat
            if(head.x === food.x && head.y === food.y) {
                let pts = food.type === 'gold' ? 5 : 1;
                score += pts;
                document.getElementById('score').innerText = score;
                
                // FX
                sfx(food.type === 'gold' ? 'powerup' : 'eat');
                createExplosion(head.x * BOX + 10, head.y * BOX + 10, food.type === 'gold' ? '#ffd700' : 'var(--food)');
                
                // Speed Up slightly
                if(speed > 60) speed -= 1;
                
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function spawnFood() {
            // 10% chance for Gold Apple
            let isGold = Math.random() < 0.1;
            
            let valid = false;
            while(!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_W),
                    y: Math.floor(Math.random() * GRID_H),
                    type: isGold ? 'gold' : 'normal'
                };
                valid = true;
                for(let p of snake) if(p.x === food.x && p.y === food.y) valid = false;
            }
        }

        function gameOver() {
            sfx('die');
            document.body.classList.add('shaking');
            setTimeout(()=>document.body.classList.remove('shaking'), 300);
            
            let high = localStorage.getItem('snakeHigh') || 0;
            if(score > high) {
                localStorage.setItem('snakeHigh', score);
                document.getElementById('high-score').innerText = score;
            }
            
            isRunning = false;
            document.querySelector('.menu-title').innerText = "GAME OVER";
            document.getElementById('menu-overlay').classList.remove('hidden');
        }

        // --- DRAWING ---
        function draw() {
            // Clear
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Subtle)
            if (skin !== 'retro') {
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1;
                // Simplified grid drawing to save perf
            }

            // Draw Food
            let foodColor = food.type === 'gold' ? '#ffd700' : getComputedStyle(document.body).getPropertyValue('--food');
            
            ctx.fillStyle = foodColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = foodColor;
            
            let cx = food.x * BOX + 10;
            let cy = food.y * BOX + 10;
            
            if (skin === 'amour' && food.type !== 'gold') {
                // Heart Shape
                drawHeart(ctx, cx, cy, 8);
            } else {
                // Circle Shape
                ctx.beginPath();
                ctx.arc(cx, cy, food.type === 'gold' ? 8 : 6, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Draw Snake
            let snakeColor = getComputedStyle(document.body).getPropertyValue('--snake');
            let glowColor = getComputedStyle(document.body).getPropertyValue('--glow');
            
            snake.forEach((p, i) => {
                ctx.fillStyle = snakeColor;
                if(i === 0) { // Head
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = glowColor;
                    ctx.fillStyle = "#fff";
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(p.x * BOX + 1, p.y * BOX + 1, 18, 18);
            });

            // Particles
            drawParticles();
        }

        function drawHeart(ctx, x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y + size/2);
            ctx.bezierCurveTo(x, y, x - size, y - size, x - size, y - size/2);
            ctx.bezierCurveTo(x - size, y + size/2, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size, y + size/2, x + size, y - size/2);
            ctx.bezierCurveTo(x + size, y - size, x, y, x, y + size/2);
            ctx.fill();
        }

        // --- PARTICLES ---
        function createExplosion(x, y, color) {
            let col = color.startsWith('var') ? getComputedStyle(document.body).getPropertyValue(color.match(/\(([^)]+)\)/)[1]) : color;
            for(let i=0; i<12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color: col
                });
            }
        }

        function drawParticles() {
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
                
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- AUDIO (Synth) ---
        function sfx(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            
            if (type === 'eat') {
                osc.frequency.setValueAtTime(500, t); osc.frequency.exponentialRampToValueAtTime(1000, t+0.1);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.1);
            } else if (type === 'powerup') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(1200, t+0.3);
                gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.3);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(10, t+0.5);
                gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t+0.5);
            } else if (type === 'move') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, t);
                gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05);
            }
            osc.start(t); osc.stop(t+0.5);
        }
    </script>
</body>
</html>
