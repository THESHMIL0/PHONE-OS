<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v8 Adventure</title>
    <style>
        /* --- THEME VARS --- */
        :root { --bg: #050505; --case: #1a1a1a; --primary: #0f0; --text: #fff; --accent: #00eaff; }
        
        /* SKINS */
        body.skin-neon { --primary: #0f0; --glow: 0 0 10px #0f0; }
        body.skin-gold { --primary: #ffd700; --glow: 0 0 10px #ffaa00; }
        body.skin-ice { --primary: #00eaff; --glow: 0 0 10px #0088ff; }
        body.skin-void { --primary: #ff0000; --glow: 0 0 10px #880000; }
        body.skin-retro { --primary: #fff; --glow: none; --bg: #000; }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        body { 
            margin: 0; background: #000; color: var(--text); 
            overflow: hidden; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
        }

        /* --- THE DEVICE BEZEL (NEW) --- */
        .device-bezel {
            width: 100%; height: 100%; max-width: 450px; background: var(--case);
            display: flex; flex-direction: column; position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8); overflow: hidden;
        }
        @media (min-width: 500px) {
            .device-bezel { height: 95vh; border-radius: 30px; border: 4px solid #333; }
        }

        /* --- SCREEN CONTAINER --- */
        .screen-container {
            flex-grow: 1; position: relative; overflow: hidden; background: var(--bg);
            border-bottom: 2px solid #222; mask-image: linear-gradient(to bottom, black 95%, transparent 100%);
        }
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }

        /* --- NAVIGATION --- */
        .app-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 10; padding: 15px;
        }
        .screen-hidden-left { transform: translateX(-100%); }
        .screen-hidden-right { transform: translateX(100%); }
        .screen-active { transform: translateX(0); z-index: 20; }

        /* --- MENUS --- */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 40px; margin-bottom: 10px; z-index: 50; }
        .currency { background: #222; padding: 4px 12px; border-radius: 15px; color: #ffd700; font-weight: bold; border: 1px solid #444; font-size: 14px; }
        
        .logo-main { font-size: 60px; font-weight: 900; font-style: italic; color: var(--primary); text-shadow: var(--glow); letter-spacing: -3px; margin-top: 30px; }
        
        .btn-play {
            width: 80%; padding: 18px; border-radius: 40px; border: none;
            background: var(--primary); color: #000; font-size: 22px; font-weight: 900;
            box-shadow: var(--glow); cursor: pointer; text-transform: uppercase; margin: 10px 0;
        }
        .btn-play:active { transform: scale(0.96); }

        .icon-grid { display: flex; gap: 15px; margin-bottom: 30px; }
        .icon-btn { width: 55px; height: 55px; background: #222; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #333; }
        .icon-btn:active { border-color: var(--primary); color: var(--primary); }

        /* --- LEVEL SELECTOR (NEW) --- */
        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; padding: 10px; }
        .level-btn {
            aspect-ratio: 1; background: #111; border: 2px solid #333; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; color: #555; position: relative;
        }
        .level-btn.unlocked { border-color: var(--primary); color: #fff; box-shadow: inset 0 0 10px rgba(0,255,0,0.1); cursor: pointer; }
        .level-btn.completed { background: #003300; }
        .level-star { font-size: 10px; color: #ffd700; margin-top: 2px; opacity: 0; }
        .level-btn.completed .level-star { opacity: 1; }

        /* --- GAME UI --- */
        .game-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 10px; }
        .score-big { font-size: 36px; font-weight: 900; font-family: monospace; line-height: 1; }
        
        .combo-bar { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-bottom: 5px; overflow: hidden; }
        .combo-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0, #f00); transition: width 0.1s linear; }

        canvas { background: #000; border: 2px solid #333; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; aspect-ratio: 1; }
        
        /* --- CONTROLS --- */
        .controls-area { background: #111; padding: 20px; border-top: 1px solid #333; display: flex; justify-content: center; position: relative; }
        .d-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 50%; border: 1px solid #333; }
        .d-btn { width: 50px; height: 50px; background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid #444; color: var(--primary); }
        .d-btn:active { background: #333; transform: scale(0.95); border-color: var(--primary); }
        
        .ability-btn { 
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color:#000; 
            font-size: 24px; display: flex; align-items: center; justify-content: center; 
            border: 3px solid #fff; box-shadow: 0 0 15px var(--accent); transition: 0.3s;
        }
        .ability-btn.cooldown { filter: grayscale(1); opacity: 0.5; transform: translateY(-50%) scale(0.9); }

        /* --- MODAL --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-visible { opacity: 1; pointer-events: all; }
        .modal-box { background: #151515; border: 1px solid #333; padding: 25px; border-radius: 20px; text-align: center; width: 80%; transform: scale(0.8); transition: 0.3s; }
        .modal-visible .modal-box { transform: scale(1); }
        
        /* --- DAILY REWARD --- */
        .daily-btn { animation: pulse 1.5s infinite; border-color: #ffd700; color: #ffd700; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,215,0,0); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.5); } 100% { transform: scale(1); } }
        
        .shaking { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body class="skin-neon">
    <div class="device-bezel">
        <div class="screen-container">
            <div class="scanlines"></div>

            <div id="screen-menu" class="app-screen screen-active">
                <div class="top-bar">
                    <div style="font-size:10px; color:#555;">SNAKE OS v8.0</div>
                    <div class="currency">🪙 <span id="menu-bits">0</span></div>
                </div>

                <div class="logo-area">
                    <h1 class="logo-main">SNAKE</h1>
                    <div style="color:#666; letter-spacing:3px; font-size:10px;">ADVENTURE EDITION</div>
                </div>

                <div style="margin-top:auto; margin-bottom:20px; width:100%; display:flex; flex-direction:column; align-items:center; gap:15px;">
                    <button class="btn-play" onclick="nav('levels')">CAMPAIGN</button>
                    <button class="btn-play" style="background:#111; color:#fff; border:1px solid #333; font-size:16px; padding:12px; box-shadow:none;" onclick="startEndless()">∞ ENDLESS</button>
                    
                    <div class="icon-grid">
                        <div class="icon-btn" onclick="nav('shop')">🎨</div>
                        <div class="icon-btn daily-btn hidden" id="daily-btn" onclick="claimDaily()">🎁</div>
                        <div class="icon-btn" onclick="nav('settings')">⚙️</div>
                    </div>
                </div>
            </div>

            <div id="screen-levels" class="app-screen screen-hidden-right">
                <div class="top-bar">
                    <div class="icon-btn" style="width:35px; height:35px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">CAMPAIGN</div>
                    <div style="width:35px;"></div>
                </div>
                <div class="level-grid" id="level-grid">
                    </div>
            </div>

            <div id="screen-shop" class="app-screen screen-hidden-right">
                <div class="top-bar">
                    <div class="icon-btn" style="width:35px; height:35px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">SKINS</div>
                    <div class="currency">🪙 <span id="shop-bits">0</span></div>
                </div>
                <div id="skin-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; overflow-y:auto;"></div>
            </div>

            <div id="screen-game" class="app-screen screen-hidden-right" style="padding:10px;">
                <div class="game-hud">
                    <div class="icon-btn" style="width:35px; height:35px; font-size:16px;" onclick="gameOver(true)">✕</div>
                    <div style="text-align:right;">
                        <div class="score-big" id="game-score">0</div>
                        <div style="font-size:10px; color:#aaa;" id="target-text">TARGET: ∞</div>
                    </div>
                </div>
                
                <div class="combo-bar"><div class="combo-fill" id="combo-bar"></div></div>
                
                <div style="position:relative; width:100%; display:flex; justify-content:center;">
                    <canvas id="game-canvas" width="340" height="340"></canvas>
                    <div id="fx-container" style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:340px; height:340px; pointer-events:none;"></div>
                </div>
            </div>

            <div id="modal-gameover" class="modal-overlay">
                <div class="modal-box">
                    <h2 id="modal-title" style="margin:0; font-size:30px; color:var(--primary);">GAME OVER</h2>
                    <p style="color:#aaa; margin:10px 0;">SCORE: <span id="final-score" style="color:#fff;">0</span></p>
                    <div style="background:#222; padding:8px; border-radius:8px; margin-bottom:15px; font-size:14px;">
                        Earned: <span id="final-bits" style="color:#ffd700;">+0</span> 🪙
                    </div>
                    <button class="btn-play" style="width:100%; font-size:16px; padding:12px; margin:0;" onclick="restartGame()">RETRY</button>
                    <button class="icon-btn" style="width:100%; border-radius:20px; font-size:14px; margin-top:10px;" onclick="nav('menu'); hideModal()">MENU</button>
                </div>
            </div>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <div></div><div class="d-btn" ontouchstart="input('UP')" onmousedown="input('UP')">▲</div><div></div>
                <div class="d-btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">◀</div>
                <div class="d-btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">▼</div>
                <div class="d-btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">▶</div>
            </div>
            <div id="ability-btn" class="ability-btn" onclick="activateAbility()">⏳</div>
        </div>
    </div>
    <script>
        // --- DATA & CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = 17; const GRID_H = 17;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let user = {
            bits: parseInt(localStorage.getItem('snake_bits')) || 0,
            skins: JSON.parse(localStorage.getItem('snake_skins')) || ['neon'],
            skin: localStorage.getItem('snake_skin') || 'neon',
            levels: parseInt(localStorage.getItem('snake_level')) || 1,
            lastDaily: parseInt(localStorage.getItem('snake_daily')) || 0
        };

        const LEVELS = [
            { id: 1, target: 5, walls: [] }, // Tutorial
            { id: 2, target: 10, walls: [{x:4,y:4}, {x:4,y:5}, {x:12,y:4}, {x:12,y:5}] }, // Boxes
            { id: 3, target: 15, walls: [{x:8,y:3}, {x:8,y:4}, {x:8,y:5}, {x:8,y:11}, {x:8,y:12}, {x:8,y:13}] }, // Line
            { id: 4, target: 20, walls: [{x:3,y:3}, {x:13,y:3}, {x:3,y:13}, {x:13,y:13}, {x:8,y:8}] }, // Corners
            { id: 5, target: 25, walls: [{x:0,y:8}, {x:1,y:8}, {x:2,y:8}, {x:14,y:8}, {x:15,y:8}, {x:16,y:8}] }, // Gates
            { id: 6, target: 99, walls: [] } // Endless Champion
        ];

        const SKINS = {
            'neon': { name: 'Neon', price: 0, color: '#0f0' },
            'gold': { name: 'Gold', price: 200, color: '#ffd700' },
            'ice':  { name: 'Ice',  price: 500, color: '#00eaff' },
            'void': { name: 'Void', price: 1000, color: '#f00' },
            'retro':{ name: 'Retro', price: 100, color: '#fff' }
        };

        // --- INIT ---
        window.onload = () => {
            checkDaily();
            updateUI();
        };

        function checkDaily() {
            let now = Date.now();
            if (now - user.lastDaily > 86400000) { // 24 Hours
                document.getElementById('daily-btn').classList.remove('hidden');
            }
        }

        function claimDaily() {
            user.bits += 100;
            user.lastDaily = Date.now();
            localStorage.setItem('snake_daily', user.lastDaily);
            saveData();
            document.getElementById('daily-btn').classList.add('hidden');
            alert("+100 Bits!");
            updateUI();
            sfx('buy');
        }

        // --- NAVIGATION ---
        function nav(screen) {
            document.querySelectorAll('.app-screen').forEach(s => {
                s.classList.remove('screen-active'); s.classList.add('screen-hidden-left');
            });
            let target = document.getElementById('screen-'+screen);
            target.classList.remove('screen-hidden-left', 'screen-hidden-right');
            target.classList.add('screen-active');
            
            if(screen === 'levels') loadLevels();
            if(screen === 'shop') loadShop();
            if(screen === 'menu') updateUI();
            sfx('swish');
        }

        function hideModal() { document.getElementById('modal-gameover').classList.remove('modal-visible'); }
        
        function updateUI() { 
            document.getElementById('menu-bits').innerText = user.bits;
            document.body.className = `skin-${user.skin}`;
        }

        // --- LEVEL SELECTOR ---
        function loadLevels() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = "";
            LEVELS.forEach(lvl => {
                let locked = lvl.id > user.levels;
                let completed = lvl.id < user.levels;
                let el = document.createElement('div');
                el.className = `level-btn ${locked ? '' : 'unlocked'} ${completed ? 'completed' : ''}`;
                el.innerHTML = `
                    <div style="font-size:20px;">${lvl.id}</div>
                    <div style="font-size:10px;">${locked ? '🔒' : 'GOAL: '+lvl.target}</div>
                    <div class="level-star">★ COMPLETE</div>
                `;
                if(!locked) el.onclick = () => startLevel(lvl.id);
                grid.appendChild(el);
            });
        }

        // --- SHOP ---
        function loadShop() {
            document.getElementById('shop-bits').innerText = user.bits;
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = "";
            for (let id in SKINS) {
                let s = SKINS[id];
                let owned = user.skins.includes(id);
                let el = document.createElement('div');
                el.style.cssText = `background:#111; border:1px solid #333; padding:10px; border-radius:10px; display:flex; flex-direction:column; align-items:center; opacity:${user.skin===id?1:0.7}`;
                el.onclick = () => buySkin(id);
                el.innerHTML = `
                    <div style="width:20px;height:20px;background:${s.color};border-radius:50%;margin-bottom:5px;"></div>
                    <div style="font-size:12px;font-weight:bold;color:#fff;">${s.name}</div>
                    <div style="font-size:10px;color:#ffd700;">${owned ? (user.skin===id ? 'ACTIVE' : 'OWNED') : s.price+' 🪙'}</div>
                `;
                grid.appendChild(el);
            }
        }

        function buySkin(id) {
            if (user.skins.includes(id)) { user.skin = id; saveData(); loadShop(); sfx('tap'); }
            else if (user.bits >= SKINS[id].price) {
                if(confirm("Buy "+SKINS[id].name+"?")) {
                    user.bits -= SKINS[id].price; user.skins.push(id); user.skin = id;
                    saveData(); loadShop(); sfx('buy');
                }
            }
        }

        function saveData() {
            localStorage.setItem('snake_bits', user.bits);
            localStorage.setItem('snake_skins', JSON.stringify(user.skins));
            localStorage.setItem('snake_skin', user.skin);
            localStorage.setItem('snake_level', user.levels);
        }
        // --- GAME VARIABLES ---
        let snake=[], food={}, walls=[], dir={x:0,y:0}, nextDir={x:0,y:0};
        let score=0, target=0, speed=130, isRunning=false, slowMo=false;
        let combo=1, comboTimer=0, maxComboTime=3000;
        let lastTime=0, canAbility=true;
        let currentLevelId = 0; // 0 = Endless

        // --- GAME LOGIC ---
        function startEndless() { currentLevelId = 0; setupGame(0, []); }
        function startLevel(id) { currentLevelId = id; let lvl = LEVELS.find(l=>l.id===id); setupGame(lvl.target, lvl.walls); }

        function setupGame(tgt, lvlWalls) {
            hideModal();
            nav('game');
            snake = [{x:8, y:10}, {x:8, y:11}, {x:8, y:12}];
            dir = {x:0, y:-1}; nextDir = {x:0, y:-1};
            score = 0; target = tgt; walls = lvlWalls || [];
            combo = 1; comboTimer = 0; speed = 130;
            isRunning = true; slowMo = false; canAbility = true;
            
            document.getElementById('game-score').innerText = 0;
            document.getElementById('target-text').innerText = target > 0 ? "GOAL: " + target : "ENDLESS";
            document.getElementById('ability-btn').classList.remove('cooldown');
            
            spawnFood();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            lastTime = 0;
            requestAnimationFrame(loop);
            sfx('start');
        }

        function loop(timestamp) {
            if(!isRunning) return;
            
            if (combo > 1) {
                comboTimer -= (timestamp - lastTime);
                let pct = Math.max(0, (comboTimer / maxComboTime) * 100);
                document.getElementById('combo-bar').style.width = pct + "%";
                if (comboTimer <= 0) { combo = 1; }
            } else { document.getElementById('combo-bar').style.width = "0%"; }

            if (timestamp - lastTime > (slowMo ? 300 : speed)) {
                update();
                lastTime = timestamp;
            }
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            dir = nextDir;
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Collisions (Walls, Self, Obstacles)
            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H || checkSelf(head) || checkWalls(head)) {
                return gameOver(false);
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                combo++; comboTimer = maxComboTime;
                let pts = combo; score += pts;
                
                document.getElementById('game-score').innerText = score;
                spawnFloatText(head.x, head.y, "+" + pts, '#fff');
                sfx('eat');
                
                if (speed > 60) speed -= 1; // Speed up
                
                // Check Win
                if (target > 0 && score >= target) return gameOver(true);
                
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.fillRect(0,0,canvas.width, canvas.height);

            // Walls
            ctx.fillStyle = "#333";
            walls.forEach(w => {
                ctx.fillRect(w.x*BOX, w.y*BOX, BOX, BOX);
                ctx.strokeStyle="#555"; ctx.strokeRect(w.x*BOX, w.y*BOX, BOX, BOX);
            });

            // Food
            let fc = "#ff0055";
            ctx.fillStyle = fc; ctx.shadowBlur = 15; ctx.shadowColor = fc;
            ctx.beginPath(); ctx.arc(food.x*BOX+10, food.y*BOX+10, 7, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            let sc = getComputedStyle(document.body).getPropertyValue('--primary');
            snake.forEach((p,i)=>{
                ctx.fillStyle = sc;
                if(i===0) { ctx.fillStyle="#fff"; ctx.shadowBlur=15; ctx.shadowColor=sc; }
                else ctx.shadowBlur=0;
                ctx.fillRect(p.x*BOX+1, p.y*BOX+1, 18, 18);
            });
        }

        function checkSelf(h) { for(let p of snake) if(p.x === h.x && p.y === h.y) return true; return false; }
        function checkWalls(h) { for(let w of walls) if(w.x === h.x && w.y === h.y) return true; return false; }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = {x: Math.floor(Math.random()*GRID_W), y: Math.floor(Math.random()*GRID_H)};
                valid = true;
                for(let p of snake) if(p.x===food.x && p.y===food.y) valid = false;
                for(let w of walls) if(w.x===food.x && w.y===food.y) valid = false;
            }
        }

        function gameOver(win) {
            isRunning = false;
            sfx(win ? 'win' : 'die');
            if(!win) {
                document.body.classList.add('shaking');
                setTimeout(()=>document.body.classList.remove('shaking'), 300);
            }
            
            // Progress
            if (win && currentLevelId === user.levels) {
                user.levels++;
                localStorage.setItem('snake_level', user.levels);
            }
            user.bits += score;
            saveData();
            
            document.getElementById('modal-title').innerText = win ? "LEVEL COMPLETE!" : "GAME OVER";
            document.getElementById('modal-title').style.color = win ? "#0f0" : "#f00";
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-bits').innerText = "+" + score;
            document.getElementById('modal-gameover').classList.add('modal-visible');
        }

        function restartGame() {
            hideModal();
            if(currentLevelId === 0) startEndless();
            else startLevel(currentLevelId);
        }

        function spawnFloatText(x, y, text, color) {
            const el = document.createElement('div');
            el.className = 'float-text'; el.innerText = text; el.style.color = color;
            el.style.left = (x*20+10)+'px'; el.style.top = (y*20+10)+'px';
            document.getElementById('fx-container').appendChild(el);
            setTimeout(()=>el.remove(), 800);
        }

        // --- CONTROLS ---
        function input(d) {
            if(d==='UP' && dir.y!==1) nextDir={x:0, y:-1};
            if(d==='DOWN' && dir.y!==-1) nextDir={x:0, y:1};
            if(d==='LEFT' && dir.x!==1) nextDir={x:-1, y:0};
            if(d==='RIGHT' && dir.x!==-1) nextDir={x:1, y:0};
        }
        function activateAbility() {
            if(!isRunning || !canAbility) return;
            slowMo = true; canAbility = false;
            document.getElementById('ability-btn').classList.add('cooldown');
            document.querySelector('.screen-active').style.filter = "saturation(0)";
            sfx('buy');
            setTimeout(()=>{ slowMo = false; document.querySelector('.screen-active').style.filter = "none"; }, 3000);
        }
        
        let tX=0, tY=0;
        document.body.addEventListener('touchstart', e=>{tX=e.touches[0].clientX; tY=e.touches[0].clientY;}, {passive:false});
        document.body.addEventListener('touchend', e=>{
            let dX = e.changedTouches[0].clientX - tX, dY = e.changedTouches[0].clientY - tY;
            if(Math.abs(dX)>Math.abs(dY)) input(dX>0?'RIGHT':'LEFT'); else input(dY>0?'DOWN':'UP');
        }, {passive:false});

        function sfx(type) {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            if (type === 'eat') { osc.frequency.setValueAtTime(500+(combo*50), t); osc.frequency.exponentialRampToValueAtTime(1000, t+0.1); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); }
            else if (type === 'die') { osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(50, t+0.5); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'tap') { osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05); }
            else if (type === 'swish') { osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(100, t+0.2); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.2); }
            else if (type === 'buy') { osc.type='square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.3); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.3); }
            else if (type === 'win') { osc.type='sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.4); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.4); }
            osc.start(t); osc.stop(t+0.5);
        }
    </script>
</body>
