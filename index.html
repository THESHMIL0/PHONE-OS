<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v12.1 Fixed</title>
    <style>
        /* --- VARIABLES --- */
        :root { --bg: #050505; --case: #111; --primary: #0f0; --accent: #00eaff; --text: #fff; }
        
        body.skin-neon { --primary: #0f0; --glow: 0 0 15px rgba(0,255,0,0.6); }
        body.skin-gold { --primary: #ffd700; --glow: 0 0 15px rgba(255,215,0,0.6); }
        body.skin-ice { --primary: #00eaff; --glow: 0 0 15px rgba(0,234,255,0.6); }
        body.skin-void { --primary: #ff0000; --glow: 0 0 15px rgba(255,0,0,0.6); }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        body { 
            margin: 0; background: #000; color: var(--text); 
            overflow: hidden; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
        }

        /* --- DEVICE BEZEL --- */
        .device-bezel {
            width: 100%; height: 100%; max-width: 500px; background: var(--case);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
        }
        @media (min-width: 500px) {
            .device-bezel { height: 95vh; border-radius: 40px; border: 6px solid #333; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        }

        .screen-container {
            flex-grow: 1; position: relative; overflow: hidden; background: var(--bg);
            transition: background 0.3s; z-index: 10;
        }
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }

        /* --- SCREENS --- */
        .app-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
            z-index: 10; padding: 20px; opacity: 0; pointer-events: none;
        }
        .screen-active { transform: scale(1); opacity: 1; pointer-events: all; z-index: 20; }
        .screen-hidden { transform: scale(0.95); opacity: 0; pointer-events: none; }

        /* --- UI ELEMENTS --- */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 40px; margin-bottom: 20px; z-index: 50; }
        .currency { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; color: #ffd700; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        
        .logo-main { 
            font-size: 70px; font-weight: 900; font-style: italic; color: var(--primary); 
            text-shadow: 0 0 20px var(--primary); letter-spacing: -4px; margin-top: 40px; margin-bottom: 5px;
            animation: floatLogo 3s ease-in-out infinite;
        }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .btn-play {
            width: 80%; padding: 20px; border-radius: 25px; border: none;
            background: var(--primary); color: #000; font-size: 24px; font-weight: 900;
            box-shadow: var(--glow); cursor: pointer; text-transform: uppercase; margin: 15px 0;
            transition: transform 0.1s; letter-spacing: 1px; position: relative; overflow: hidden;
        }
        .btn-play:active { transform: scale(0.96); }

        .icon-grid { display: flex; gap: 20px; margin-bottom: 40px; }
        .icon-btn { 
            width: 60px; height: 60px; background: rgba(255,255,255,0.05); border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; font-size: 26px; 
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.1s; 
        }
        .icon-btn:active { border-color: var(--primary); color: var(--primary); transform: scale(0.9); }

        /* --- GAME UI --- */
        .game-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; margin-bottom: 5px; }
        .score-big { font-size: 40px; font-weight: 900; color: var(--primary); text-shadow: var(--glow); line-height: 1; }
        .combo-bar-con { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
        .combo-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0, #f05); transition: width 0.1s linear; }

        canvas { 
            background: rgba(0,0,0,0.3); border: 2px solid #333; border-radius: 12px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.5); width: 100%; max-width: 400px; aspect-ratio: 1;
            image-rendering: pixelated; 
        }

        /* --- CONTROLS --- */
        .controls-area { 
            background: #111; padding: 20px; border-top: 4px solid #222; 
            display: flex; justify-content: center; position: relative; z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .controls-hidden { transform: translateY(150%); pointer-events: none; }

        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            background: #0a0a0a; padding: 12px; border-radius: 50%; border: 1px solid #333;
            box-shadow: inset 0 0 20px #000;
        }
        .d-btn { 
            width: 55px; height: 55px; background: #1f1f1f; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            border: 2px solid #333; color: var(--primary); cursor: pointer;
            box-shadow: 0 4px 0 #000; transition: transform 0.05s;
        }
        .d-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; border-color: var(--primary); background: #252525; }
        
        .ability-btn { 
            position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
            width: 70px; height: 70px; border-radius: 50%; background: var(--accent); color:#000; 
            font-size: 28px; display: flex; align-items: center; justify-content: center; 
            border: 4px solid #fff; box-shadow: 0 0 20px var(--accent); cursor: pointer; transition: 0.2s;
        }
        .ability-btn:active { transform: translateY(-50%) scale(0.9); }
        .ability-btn.cooldown { filter: grayscale(1); opacity: 0.5; transform: translateY(-50%) scale(0.9); cursor: not-allowed; }

        /* --- SHOP GRID --- */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        .shop-item { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .shop-item.active { border-color: var(--primary); background: rgba(0,255,0,0.05); box-shadow: inset 0 0 20px rgba(0,255,0,0.1); }

        /* --- MODAL --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(5px); }
        .modal-visible { opacity: 1; pointer-events: all; }
        .modal-box { background: #151515; border: 2px solid #333; padding: 30px; border-radius: 25px; text-align: center; width: 85%; transform: scale(0.8); transition: 0.3s; box-shadow: 0 0 60px rgba(0,0,0,0.8); }
        .modal-visible .modal-box { transform: scale(1); }
        
        .float-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 5px #000; font-size: 24px; z-index: 50; }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-50px); } }
        .shaking { animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body class="skin-neon">
    <div class="device-bezel">
        <div class="screen-container">
            <div class="scanlines"></div>

            <div id="screen-menu" class="app-screen screen-active">
                <div class="top-bar">
                    <div style="font-size:12px; color:#555; font-weight:bold;">SNAKE v12.1</div>
                    <div class="currency">🪙 <span id="menu-bits">0</span></div>
                </div>

                <div class="logo-main">SNAKE</div>
                <div style="color:#666; letter-spacing:4px; font-size:12px; margin-bottom:30px;">FLAWLESS EDITION</div>

                <div style="margin-top:auto; margin-bottom:40px; width:100%; display:flex; flex-direction:column; align-items:center; gap:15px;">
                    <div style="display:flex; gap:10px; width:100%; justify-content:center;">
                        <div id="mode-endless" class="icon-btn" style="width:auto; padding:0 20px; font-size:12px; font-weight:bold; border-color:var(--primary); color:var(--primary);" onclick="setMode('endless')">∞ ENDLESS</div>
                        <div id="mode-challenge" class="icon-btn" style="width:auto; padding:0 20px; font-size:12px; font-weight:bold;" onclick="setMode('challenge')">⚡ CHALLENGE</div>
                    </div>

                    <button class="btn-play" onclick="startGame()">▶ START</button>
                    
                    <div class="icon-grid">
                        <div class="icon-btn" onclick="nav('shop')">🛒</div>
                        <div class="icon-btn" onclick="nav('settings')">⚙️</div>
                        <div class="icon-btn" style="color:#ffd700; border-color:#ffd700;" onclick="claimDaily()" id="daily-btn">🎁</div>
                    </div>
                </div>
            </div>

            <div id="screen-shop" class="app-screen screen-hidden">
                <div class="top-bar">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:20px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">SKIN SHOP</div>
                    <div class="currency">🪙 <span id="shop-bits">0</span></div>
                </div>
                <div id="shop-grid" class="shop-grid"></div>
            </div>

            <div id="screen-settings" class="app-screen screen-hidden">
                <div class="top-bar">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:20px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">SETTINGS</div>
                    <div style="width:40px;"></div>
                </div>
                <div style="display:flex; flex-direction:column; gap:15px; width:100%;">
                    <div class="shop-item" onclick="toggleSetting('sound')">
                        <div style="font-weight:bold;">🔊 SOUND</div>
                        <div style="color:var(--primary);" id="opt-sound">ON</div>
                    </div>
                    <div class="shop-item" onclick="toggleSetting('vibro')">
                        <div style="font-weight:bold;">📳 HAPTICS</div>
                        <div style="color:var(--primary);" id="opt-vibro">ON</div>
                    </div>
                    <div class="shop-item" style="border-color:#f00;" onclick="resetData()">
                        <div style="font-weight:bold; color:#f00;">⚠️ RESET DATA</div>
                    </div>
                </div>
            </div>

            <div id="screen-game" class="app-screen screen-hidden" style="padding:10px;">
                <div class="game-hud">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:16px;" onclick="pauseGame()">ll</div>
                    <div style="text-align:right;">
                        <div class="score-big" id="game-score">0</div>
                        <div style="font-size:10px; color:#888;" id="high-score-display">BEST: 0</div>
                    </div>
                </div>
                <div class="combo-bar-con"><div class="combo-fill" id="combo-bar"></div></div>
                
                <div style="position:relative; width:100%; display:flex; justify-content:center;">
                    <canvas id="game-canvas"></canvas>
                    <div id="fx-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
                </div>
            </div>

            <div id="modal-gameover" class="modal-overlay">
                <div class="modal-box">
                    <h1 style="color:#f00; margin:0; font-size:35px;">CRASHED!</h1>
                    <div style="font-size:18px; color:#fff; margin:10px 0;">SCORE: <span id="final-score">0</span></div>
                    <div style="background:#222; padding:10px; border-radius:10px; margin-bottom:20px; color:#ffd700; font-weight:bold;">
                        +<span id="final-bits">0</span> 🪙 EARNED
                    </div>
                    <div class="btn-play" style="width:100%; font-size:18px; padding:15px; margin:0;" onclick="restartGame()">RETRY</div>
                    <div class="icon-btn" style="width:100%; border-radius:30px; font-size:14px; margin-top:15px;" onclick="nav('menu'); hideModal()">EXIT TO MENU</div>
                </div>
            </div>
        </div>

        <div class="controls-area controls-hidden" id="controls">
            <div class="d-pad">
                <div></div><div class="d-btn" ontouchstart="input('UP', event)" onmousedown="input('UP', event)">▲</div><div></div>
                <div class="d-btn" ontouchstart="input('LEFT', event)" onmousedown="input('LEFT', event)">◀</div>
                <div class="d-btn" ontouchstart="input('DOWN', event)" onmousedown="input('DOWN')">▼</div>
                <div class="d-btn" ontouchstart="input('RIGHT', event)" onmousedown="input('RIGHT', event)">▶</div>
            </div>
            <div id="ability-btn" class="ability-btn" onclick="activateAbility()">⚡</div>
        </div>
    </div>
    <script>
        // --- CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const cssWidth = 340;
        const cssHeight = 340;
        canvas.style.width = cssWidth + "px";
        canvas.style.height = cssHeight + "px";
        canvas.width = cssWidth * dpr;
        canvas.height = cssHeight * dpr;
        ctx.scale(dpr, dpr);
        
        const BOX = 20;
        const GRID_W = cssWidth / BOX;
        const GRID_H = cssHeight / BOX;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- DATA ---
        let user = {
            bits: parseInt(localStorage.getItem('snake_bits')) || 0,
            skins: JSON.parse(localStorage.getItem('snake_skins')) || ['neon'],
            skin: localStorage.getItem('snake_skin') || 'neon',
            settings: JSON.parse(localStorage.getItem('snake_settings')) || { sound: true, vibro: true },
            lastDaily: parseInt(localStorage.getItem('snake_daily')) || 0,
            highScore: parseInt(localStorage.getItem('snake_high')) || 0
        };

        const SKINS = {
            'neon': { name: 'Neon', price: 0, color: '#0f0', shape: 'square' },
            'gold': { name: 'Gold', price: 300, color: '#ffd700', shape: 'circle' },
            'ice':  { name: 'Ice',  price: 500, color: '#00eaff', shape: 'square' },
            'ruby': { name: 'Ruby', price: 800, color: '#ff0055', shape: 'diamond' }
        };

        // --- STATE ---
        let snake=[], food={}, dir={x:0,y:-1};
        let inputQueue = []; 
        let score=0, speed=130, isRunning=false, slowMo=false, canAbility=true;
        let combo=1, comboTimer=0, maxComboTime=3000;
        let lastTime=0, animationId=null;
        let mode = 'endless';

        // --- INIT ---
        window.onload = () => { updateUI(); checkDaily(); };

        function updateUI() {
            document.getElementById('menu-bits').innerText = user.bits;
            document.body.className = `skin-${user.skin}`;
            document.getElementById('opt-sound').innerText = user.settings.sound ? "ON" : "OFF";
            document.getElementById('opt-vibro').innerText = user.settings.vibro ? "ON" : "OFF";
        }

        // --- NAV ---
        function nav(screen) {
            document.querySelectorAll('.app-screen').forEach(s => {
                s.classList.remove('screen-active'); s.classList.add('screen-hidden');
            });
            let target = document.getElementById('screen-'+screen);
            target.classList.remove('screen-hidden');
            target.classList.add('screen-active');
            
            const controls = document.getElementById('controls');
            if(screen === 'game') controls.classList.remove('controls-hidden');
            else controls.classList.add('controls-hidden');

            if(screen === 'shop') loadShop();
            if(screen === 'menu') updateUI();
            sfx('swish');
        }

        function hideModal() { document.getElementById('modal-gameover').classList.remove('modal-visible'); }
        function setMode(m) {
            mode = m;
            document.getElementById('mode-endless').style.borderColor = m==='endless' ? 'var(--primary)' : '#333';
            document.getElementById('mode-endless').style.color = m==='endless' ? 'var(--primary)' : '#555';
            document.getElementById('mode-challenge').style.borderColor = m==='challenge' ? 'var(--primary)' : '#333';
            document.getElementById('mode-challenge').style.color = m==='challenge' ? 'var(--primary)' : '#555';
            sfx('tap');
        }

        // --- GAME START (FIXED) ---
        function startGame() {
            // 1. SWITCH SCREEN FIRST
            nav('game'); 
            hideModal();

            // 2. RESET STATE
            snake = [{x:8, y:10}, {x:8, y:11}, {x:8, y:12}]; 
            dir = {x:0, y:-1}; // Ensure moving UP
            inputQueue = [];   // Clear inputs
            score = 0; combo = 1; comboTimer = 0;
            speed = mode === 'challenge' ? 100 : 130;
            isRunning = true; slowMo = false; canAbility = true;
            
            // 3. UI RESET
            document.getElementById('game-score').innerText = 0;
            document.getElementById('high-score-display').innerText = "BEST: " + user.highScore;
            document.getElementById('combo-bar').style.width = "0%";
            document.getElementById('ability-btn').classList.remove('cooldown');
            
            // 4. SPAWN & AUDIO
            spawnFood();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // 5. START LOOP
            if(animationId) cancelAnimationFrame(animationId);
            lastTime = performance.now();
            animationId = requestAnimationFrame(loop);
            sfx('start');
        }
        function loop(timestamp) {
            if(!isRunning) return;
            
            if (combo > 1) {
                comboTimer -= (timestamp - lastTime);
                let pct = Math.max(0, (comboTimer / maxComboTime) * 100);
                document.getElementById('combo-bar').style.width = pct + "%";
                if (comboTimer <= 0) combo = 1;
            }

            let interval = slowMo ? 300 : speed;
            if (timestamp - lastTime > interval) {
                update();
                lastTime = timestamp;
            }
            draw();
            animationId = requestAnimationFrame(loop);
        }

        function update() {
            // INPUT QUEUE LOGIC (FIXED)
            if (inputQueue.length > 0) {
                let next = inputQueue.shift();
                if (!(next.x === -dir.x && next.y === -dir.y) && !(next.x === dir.x && next.y === dir.y)) {
                    dir = next;
                } else if (inputQueue.length > 0) {
                    let next2 = inputQueue.shift();
                    if (!(next2.x === -dir.x && next2.y === -dir.y)) dir = next2;
                }
            }

            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H || checkSelf(head)) {
                return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                combo++; comboTimer = maxComboTime;
                let pts = combo; score += pts;
                document.getElementById('game-score').innerText = score;
                spawnFloatText(head.x, head.y, "+" + pts, '#fff');
                sfx('eat');
                if (mode === 'challenge' && speed > 50) speed -= 2;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function checkSelf(h) { for(let p of snake) if(p.x === h.x && p.y === h.y) return true; return false; }

        function draw() {
            ctx.clearRect(0,0,cssWidth, cssHeight);
            let fc = "#f05";
            ctx.fillStyle = fc; ctx.shadowBlur = 15; ctx.shadowColor = fc;
            ctx.beginPath(); ctx.arc(food.x*BOX+10, food.y*BOX+10, 7, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            let sc = getComputedStyle(document.body).getPropertyValue('--primary');
            let shape = SKINS[user.skin].shape;
            
            snake.forEach((p,i)=>{
                ctx.fillStyle = sc;
                if(i===0) { ctx.fillStyle="#fff"; ctx.shadowBlur=15; ctx.shadowColor=sc; }
                else ctx.shadowBlur=0;
                if(shape === 'circle') { ctx.beginPath(); ctx.arc(p.x*BOX+10, p.y*BOX+10, 9, 0, Math.PI*2); ctx.fill(); } 
                else { ctx.fillRect(p.x*BOX+1, p.y*BOX+1, 18, 18); }
            });
        }

        function spawnFood() {
            let valid=false;
            while(!valid) {
                food = {x:Math.floor(Math.random()*GRID_W), y:Math.floor(Math.random()*GRID_H)};
                valid=true;
                for(let p of snake) if(p.x===food.x && p.y===food.y) valid=false;
            }
        }

        function gameOver() {
            isRunning = false; sfx('die');
            if(user.settings.vibro) navigator.vibrate(300);
            if(score > user.highScore) { user.highScore = score; localStorage.setItem('snake_high', score); }
            user.bits += score; saveData();
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-bits').innerText = "+"+score;
            document.getElementById('modal-gameover').classList.add('modal-visible');
        }

        function restartGame() { hideModal(); startGame(); }
        function pauseGame() { isRunning = !isRunning; if(isRunning) { lastTime=performance.now(); loop(); } else alert("PAUSED"); }

        function activateAbility() {
            if(!isRunning || slowMo || !canAbility) return;
            slowMo = true; canAbility = false;
            document.getElementById('ability-btn').classList.add('cooldown');
            document.querySelector('.screen-active').style.filter = "saturation(0)";
            sfx('buy');
            setTimeout(()=>{
                slowMo = false;
                document.querySelector('.screen-active').style.filter = "none";
                setTimeout(()=>{canAbility=true; document.getElementById('ability-btn').classList.remove('cooldown');}, 5000);
            }, 3000);
        }

        function spawnFloatText(x, y, txt, col) {
            let el = document.createElement('div');
            el.className = 'float-text'; el.innerText = txt; el.style.color = col;
            el.style.left = (x*20+10)+'px'; el.style.top = (y*20+10)+'px';
            document.getElementById('fx-layer').appendChild(el);
            setTimeout(()=>el.remove(), 800);
        }

        function input(d, e) {
            if(e) e.preventDefault();
            let move = {x:0, y:0};
            if(d==='UP') move = {x:0, y:-1};
            if(d==='DOWN') move = {x:0, y:1};
            if(d==='LEFT') move = {x:-1, y:0};
            if(d==='RIGHT') move = {x:1, y:0};
            if (inputQueue.length < 2) inputQueue.push(move);
        }
        
        let tX=0, tY=0;
        document.body.addEventListener('touchstart', e=>{tX=e.touches[0].clientX; tY=e.touches[0].clientY;}, {passive:false});
        document.body.addEventListener('touchend', e=>{
            let dX = e.changedTouches[0].clientX - tX, dY = e.changedTouches[0].clientY - tY;
            if(Math.abs(dX)>Math.abs(dY)) input(dX>0?'RIGHT':'LEFT'); else input(dY>0?'DOWN':'UP');
        }, {passive:false});
        document.addEventListener('keydown', e => {
            if(e.key==='ArrowUp'||e.key==='w') input('UP');
            if(e.key==='ArrowDown'||e.key==='s') input('DOWN');
            if(e.key==='ArrowLeft'||e.key==='a') input('LEFT');
            if(e.key==='ArrowRight'||e.key==='d') input('RIGHT');
            if(e.key===' ') activateAbility();
        });

        // --- SHOP & DATA ---
        function loadShop() {
            document.getElementById('shop-bits').innerText = user.bits;
            const grid = document.getElementById('shop-grid'); grid.innerHTML = "";
            for (let id in SKINS) {
                let s = SKINS[id], owned = user.skins.includes(id), active = user.skin === id;
                let el = document.createElement('div');
                el.className = `shop-item ${active?'active':''}`;
                el.onclick = () => buySkin(id);
                el.innerHTML = `<div style="width:20px;height:20px;background:${s.color};border-radius:${s.shape==='circle'?'50%':'4px'};box-shadow:0 0 10px ${s.color};margin-bottom:5px;"></div><div style="font-size:12px;font-weight:bold;color:#fff;">${s.name}</div>${owned ? (active?'<span style="font-size:10px;color:#0f0">EQUIPPED</span>':'') : `<div class="price-tag">${s.price} 🪙</div>`}`;
                grid.appendChild(el);
            }
        }
        function buySkin(id) {
            if (user.skins.includes(id)) { user.skin = id; saveData(); loadShop(); sfx('tap'); }
            else if (user.bits >= SKINS[id].price) {
                if(confirm("Buy "+SKINS[id].name+"?")) {
                    user.bits -= SKINS[id].price; user.skins.push(id); user.skin = id;
                    saveData(); loadShop(); sfx('buy');
                }
            }
        }
        function saveData() {
            localStorage.setItem('snake_bits', user.bits);
            localStorage.setItem('snake_skins', JSON.stringify(user.skins));
            localStorage.setItem('snake_skin', user.skin);
            localStorage.setItem('snake_settings', JSON.stringify(user.settings));
            localStorage.setItem('snake_daily', user.lastDaily);
            localStorage.setItem('snake_high', user.highScore);
        }
        function toggleSetting(k) { user.settings[k]=!user.settings[k]; updateUI(); saveData(); sfx('tap'); }
        function resetData() { if(confirm("Reset all data?")) { localStorage.clear(); location.reload(); } }
        function checkDaily() {
            let btn = document.getElementById('daily-btn');
            if (Date.now() - user.lastDaily > 86400000) { btn.style.opacity = 1; btn.innerText = "🎁"; } 
            else { btn.style.opacity = 0.3; btn.innerText = "🕒"; }
        }
        function claimDaily() {
            if (Date.now() - user.lastDaily > 86400000) {
                user.bits += 100; user.lastDaily = Date.now(); saveData(); checkDaily(); sfx('buy'); alert("+100 Bits!"); updateUI();
            }
        }

        function sfx(type) {
            if(!user.settings.sound) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            if (type === 'eat') { osc.frequency.setValueAtTime(600+(combo*50), t); osc.frequency.linearRampToValueAtTime(1000, t+0.1); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); }
            else if (type === 'die') { osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(50, t+0.5); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'tap') { osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05); }
            else if (type === 'swish') { osc.type='triangle'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(100, t+0.2); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.2); }
            else if (type === 'buy') { osc.type='square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.3); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.3); }
            else if (type === 'start') { osc.type='square'; osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(600, t+0.2); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.2); }
            osc.start(t); osc.stop(t+0.5);
        }
    </script>
</body>
