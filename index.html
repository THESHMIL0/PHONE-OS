<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gamer OS Ultima</title>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }

        /* --- CRT EFFECT --- */
        body::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* --- TURBO MODE (Red Shift) --- */
        body.turbo-mode { color: #ff0055; text-shadow: 2px 0 #0ff; }
        body.turbo-mode .phone-container { border-color: #ff0055; animation: shake 0.5s infinite; }
        body.turbo-mode .app-icon, body.turbo-mode .game-card { border-color: #ff0055; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* --- PHONE FRAME --- */
        .phone-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: #111; border: 3px solid #0ff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transition: 0.3s;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #050505; opacity: 1; z-index: 10; transition: 0.2s;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: 0; }
        
        .back-btn {
            position: absolute; top: 10px; left: 10px; z-index: 50;
            background: #000; color: inherit; border: 1px solid currentColor;
            padding: 5px 15px; font-weight: bold; cursor: pointer;
        }

        /* --- UI ELEMENTS --- */
        .status-bar { padding: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid currentColor; font-weight: bold; }
        .app-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; width: 100%; }
        .game-card {
            background: #1a1a1a; border: 1px solid #333; height: 110px; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 35px; cursor: pointer; transition: 0.1s;
        }
        .game-card:active { background: #333; transform: scale(0.95); }
        .game-card span { font-size: 14px; margin-top: 10px; opacity: 0.7; }

        /* --- RUNNER GAME --- */
        #runner-canvas { border-bottom: 2px solid currentColor; background: #000; }
        .tap-zone { width: 100%; height: 100px; margin-top: 20px; border: 1px dashed currentColor; display: flex; align-items: center; justify-content: center; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="phone" class="phone-container">
        <div class="status-bar">
            <span>🚀 SYSTEM READY</span>
            <span id="turbo-badge" style="display:none; color:red;">TURBO ON</span>
            <span>🔋 100%</span>
        </div>

        <div id="lock-screen" class="screen">
            <h1 style="font-size: 50px; text-shadow: 0 0 10px currentColor;">LOCKED</h1>
            <input type="password" id="pass-input" maxlength="4" placeholder="____" style="background:transparent; border:none; border-bottom:2px solid currentColor; color:inherit; font-size:30px; text-align:center; width:100px; margin:20px;">
            <button onclick="unlock()" style="background:currentColor; color:black; border:none; padding:10px 30px; font-weight:bold;">LOGIN</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <div class="app-grid">
                <div class="game-card" onclick="openApp('runner')">🏃<span>Neon Dash</span></div>
                <div class="game-card" onclick="openApp('space')">🚀<span>Galaxy War</span></div>
                <div class="game-card" onclick="toggleTurbo()">⚡<span>Overclock</span></div>
                <div class="game-card" onclick="alert('System Optimal')">⚙️<span>System</span></div>
            </div>
        </div>

        <div id="runner-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <div style="width:100%; padding: 0 20px; display:flex; justify-content:space-between;">
                <h2>SCORE: <span id="run-score">0</span></h2>
            </div>
            <canvas id="runner-canvas" width="300" height="200"></canvas>
            <div class="tap-zone" onmousedown="jump()" ontouchstart="jump()">
                TAP TO JUMP
            </div>
        </div>

        <div id="space-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <h3 id="space-score">SCORE: 0</h3>
            <canvas id="space-canvas" width="300" height="350" style="border:1px solid #333; background:#000;"></canvas>
            <div style="display:flex; gap:20px; margin-top:10px;">
                <button ontouchstart="moveShip(-1)" ontouchend="stopShip()" style="padding:15px; font-size:20px;">⬅️</button>
                <button onclick="fireLaser()" style="padding:15px; font-size:20px; color:red; border-color:red;">🔥</button>
                <button ontouchstart="moveShip(1)" ontouchend="stopShip()" style="padding:15px; font-size:20px;">➡️</button>
            </div>
        </div>
    </div>
    <script>
        const PASS = "1234";
        let turbo = false;
        
        function unlock() {
            if(document.getElementById('pass-input').value === PASS) {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
            }
        }
        function goHome() {
            stopGames();
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('home-screen').classList.remove('hidden');
        }
        function openApp(app) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(app + '-screen').classList.remove('hidden');
            if(app === 'runner') startRunner();
            if(app === 'space') startSpace();
        }
        function toggleTurbo() {
            turbo = !turbo;
            document.body.classList.toggle('turbo-mode');
            document.getElementById('turbo-badge').style.display = turbo ? 'inline' : 'none';
            if(turbo) navigator.vibrate(200);
        }
        function stopGames() {
            cancelAnimationFrame(runLoop);
            cancelAnimationFrame(spaceLoop);
        }
        // --- NEON DASH RUNNER ---
        let runCtx, dino, obstacles, runLoop, runScore, runSpeed;
        function startRunner() {
            const cvs = document.getElementById('runner-canvas'); runCtx = cvs.getContext('2d');
            dino = { x: 30, y: 160, w: 20, h: 20, dy: 0, jump: false };
            obstacles = []; runScore = 0; runSpeed = turbo ? 8 : 5;
            loopRunner();
        }
        function jump() {
            if(!dino.jump) { dino.dy = -10; dino.jump = true; }
        }
        function loopRunner() {
            // Physics
            dino.dy += 0.6; // Gravity
            dino.y += dino.dy;
            if(dino.y > 160) { dino.y = 160; dino.dy = 0; dino.jump = false; }

            // Obstacles
            if(Math.random() < 0.02) obstacles.push({x: 300, w: 20, h: 30});
            
            // Draw
            runCtx.fillStyle = "#000"; runCtx.fillRect(0,0,300,200);
            runCtx.fillStyle = turbo ? "#ff0055" : "#0ff"; // Player color
            runCtx.fillRect(dino.x, dino.y, dino.w, dino.h); // Player
            
            runCtx.fillStyle = "red";
            obstacles.forEach((obs, i) => {
                obs.x -= runSpeed;
                runCtx.fillRect(obs.x, 170, obs.w, obs.h); // Spikes
                // Collision
                if(dino.x < obs.x + obs.w && dino.x + dino.w > obs.x && dino.y + dino.h > 170) {
                    alert("CRASH! Score: " + runScore); startRunner();
                }
            });

            runScore++;
            document.getElementById('run-score').innerText = runScore;
            runLoop = requestAnimationFrame(loopRunner);
        }

        // --- SPACE SHOOTER (Mini Version) ---
        let spaceCtx, ship, bullets, aliens, spaceLoop;
        function startSpace() {
            const cvs = document.getElementById('space-canvas'); spaceCtx = cvs.getContext('2d');
            ship = {x: 135, dx: 0}; bullets = []; aliens = [];
            loopSpace();
        }
        function moveShip(d) { ship.dx = d * 5; }
        function stopShip() { ship.dx = 0; }
        function fireLaser() { bullets.push({x: ship.x+12, y: 320}); }
        function loopSpace() {
            spaceCtx.fillStyle = "#000"; spaceCtx.fillRect(0,0,300,350);
            
            ship.x += ship.dx;
            spaceCtx.fillStyle = turbo ? "#ff0055" : "#0ff";
            spaceCtx.beginPath(); spaceCtx.moveTo(ship.x+15, 320); spaceCtx.lineTo(ship.x, 350); spaceCtx.lineTo(ship.x+30, 350); spaceCtx.fill();

            spaceCtx.fillStyle = "yellow";
            bullets.forEach((b,i) => {
                b.y -= 10; spaceCtx.fillRect(b.x, b.y, 6, 10);
            });

            if(Math.random() < 0.05) aliens.push({x: Math.random()*270, y: 0});
            spaceCtx.fillStyle = "green";
            aliens.forEach((a,i) => {
                a.y += (turbo ? 5 : 2); spaceCtx.fillRect(a.x, a.y, 20, 20);
                // Hit check
                bullets.forEach((b,j) => {
                    if(b.x > a.x && b.x < a.x+20 && b.y < a.y+20) { aliens.splice(i,1); bullets.splice(j,1); }
                });
            });
            spaceLoop = requestAnimationFrame(loopSpace);
        }
    </script>
</body>
</html>
