<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phone OS v3</title>
    <style>
        /* --- CORE STYLES --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: #111; color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; user-select: none;
            height: 100vh; width: 100vw;
        }

        /* --- THEMES --- */
        :root { --accent: #0A84FF; --bg-grad: linear-gradient(135deg, #1c1c1e, #000); }
        .theme-love { --accent: #FF2D55; --bg-grad: linear-gradient(135deg, #500, #200); }
        .theme-matrix { --accent: #00FF00; --bg-grad: linear-gradient(135deg, #002200, #000); }

        .phone-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: var(--bg-grad); transition: background 0.5s;
        }

        /* --- UI ELEMENTS --- */
        .status-bar { padding: 10px 20px; display: flex; justify-content: space-between; font-weight: 600; z-index: 100; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 1; z-index: 10; pointer-events: all; transition: opacity 0.3s;
        }
        .screen.hidden { opacity: 0; pointer-events: none; z-index: 0; }
        
        button { cursor: pointer; border: none; outline: none; }
        .back-btn {
            position: absolute; top: 50px; left: 20px;
            background: rgba(255,255,255,0.2); color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 14px;
        }

        /* --- LOCK & HOME --- */
        input[type="password"] {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 15px; border-radius: 12px; color: white;
            font-size: 24px; text-align: center; width: 150px; margin: 20px 0;
        }
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; padding: 20px; }
        .app-icon {
            width: 70px; height: 70px; background: rgba(255,255,255,0.1);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .app-icon:active { transform: scale(0.9); }

        /* --- CLICKER GAME --- */
        .coin-btn {
            width: 150px; height: 150px; background: #FFD700;
            border-radius: 50%; border: 5px solid #DAA520;
            font-size: 60px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); margin: 20px;
            transition: transform 0.05s;
        }
        .coin-btn:active { transform: scale(0.95); }
        .shop-item {
            background: rgba(255,255,255,0.1); width: 80%; padding: 10px;
            margin: 5px; border-radius: 10px; display: flex; justify-content: space-between;
            align-items: center;
        }

        /* --- SETTINGS --- */
        .setting-row {
            width: 80%; padding: 15px; margin: 5px;
            background: rgba(255,255,255,0.1); border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .theme-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body>
    <div id="phone" class="phone-container">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <span>5G 🔋</span>
        </div>

        <div id="lock-screen" class="screen">
            <div style="font-size: 50px; margin-bottom: 20px;">🔒</div>
            <input type="password" id="pass-input" maxlength="4" placeholder="••••">
            <button onclick="checkPass()" style="padding: 10px 30px; background: var(--accent); color:white; border-radius: 20px;">Unlock</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <div class="app-grid">
                <div class="app-icon" onclick="openApp('snake')">🐍</div>
                <div class="app-icon" onclick="openApp('ttt')">❌</div>
                <div class="app-icon" onclick="openApp('clicker')">💰</div>
                <div class="app-icon" onclick="openApp('settings')">⚙️</div>
            </div>
        </div>

        <div id="clicker-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <h1 id="money-display" style="color: #FFD700; text-shadow: 0 0 10px orange;">$0</h1>
            <div class="coin-btn" onclick="clickCoin()">🪙</div>
            
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center; overflow-y: auto; height: 40%;">
                <h3>🛒 Shop</h3>
                <div class="shop-item" onclick="buyUpgrade('auto')">
                    <span>🤖 Auto-Miner</span>
                    <span id="cost-auto" style="color: #FFD700">$50</span>
                </div>
                <div class="shop-item" onclick="buyUpgrade('multi')">
                    <span>⚡ Power Tap</span>
                    <span id="cost-multi" style="color: #FFD700">$100</span>
                </div>
            </div>
        </div>

        <div id="settings-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <h2>Settings</h2>
            
            <div class="setting-row" onclick="setTheme('default')">
                <span>Dark Mode (Default)</span>
                <div class="theme-dot" style="background: #1c1c1e;"></div>
            </div>
            <div class="setting-row" onclick="setTheme('love')">
                <span>Valentine Mode</span>
                <div class="theme-dot" style="background: #a30030;"></div>
            </div>
            <div class="setting-row" onclick="setTheme('matrix')">
                <span>Hacker Mode</span>
                <div class="theme-dot" style="background: #004400;"></div>
            </div>
            
            <button onclick="lockPhone()" style="margin-top: 30px; color: red; background: none; font-size: 16px;">🔒 Lock Phone</button>
        </div>

        <div id="snake-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">Back</button><canvas id="snake-canvas" style="background:#000; border:1px solid #333;" width="300" height="300"></canvas></div>
        <div id="ttt-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">Back</button><h2 style="margin-top:100px;">Tic Tac Toe</h2><div id="ttt-board" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;"></div></div>
    </div>
    <script>
        const PASS = "1234";
        let money = parseInt(localStorage.getItem('money')) || 0;
        let autoClickers = parseInt(localStorage.getItem('auto')) || 0;
        let multiplier = parseInt(localStorage.getItem('multi')) || 1;

        // --- CORE SYSTEM ---
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            // Auto Clicker Logic
            if(autoClickers > 0) {
                money += autoClickers;
                updateMoney();
            }
        }, 1000);

        function checkPass() {
            if(document.getElementById('pass-input').value === PASS) switchScreen('home-screen');
            else alert("Wrong Password!");
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function goHome() { switchScreen('home-screen'); saveData(); }
        function lockPhone() { switchScreen('lock-screen'); document.getElementById('pass-input').value = ""; }

        function openApp(app) {
            if(app === 'clicker') { switchScreen('clicker-screen'); updateMoney(); updateShopUI(); }
            else if(app === 'settings') switchScreen('settings-screen');
            else if(app === 'snake') { alert("Snake is sleeping... (Code stripped to fit Update 3)"); }
            else if(app === 'ttt') { alert("Tic-Tac-Toe is on break..."); }
        }

        // --- SETTINGS LOGIC ---
        function setTheme(theme) {
            const body = document.getElementById('phone');
            body.classList.remove('theme-love', 'theme-matrix');
            if(theme !== 'default') body.classList.add('theme-' + theme);
        }

        // --- CLICKER GAME LOGIC ---
        function clickCoin() {
            money += (1 * multiplier);
            updateMoney();
            // Simple bounce animation effect
            const btn = document.querySelector('.coin-btn');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => btn.style.transform = "scale(1)", 50);
        }

        function buyUpgrade(type) {
            if(type === 'auto' && money >= 50) {
                money -= 50; autoClickers++;
            } else if (type === 'multi' && money >= 100) {
                money -= 100; multiplier++;
            }
            updateMoney(); updateShopUI(); saveData();
        }

        function updateMoney() {
            document.getElementById('money-display').innerText = "$" + money;
        }

        function updateShopUI() {
            document.getElementById('cost-auto').innerText = "$50 (Own: " + autoClickers + ")";
            document.getElementById('cost-multi').innerText = "$100 (Lvl: " + multiplier + ")";
        }

        function saveData() {
            localStorage.setItem('money', money);
            localStorage.setItem('auto', autoClickers);
            localStorage.setItem('multi', multiplier);
        }
    </script>
</body>
</html>
