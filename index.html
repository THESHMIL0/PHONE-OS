<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v5 Pro</title>
    <style>
        /* --- VARIABLES --- */
        :root { --bg: #050505; --grid: #111; --snake: #0f0; --glow: #0f0; --food: #f05; --text: #fff; }
        
        /* SKINS */
        body.skin-neon { --snake: #0f0; --glow: #0f0; --food: #f05; }
        body.skin-gold { --snake: #ffd700; --glow: #ffaa00; --food: #fff; --bg: #1a1000; }
        body.skin-ice { --snake: #0ff; --glow: #0088ff; --food: #fff; --bg: #000510; }
        body.skin-void { --snake: #ff0000; --glow: #880000; --food: #333; --bg: #000; --text: #f00; }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            transition: background 0.5s;
        }

        /* --- CRT CURVE EFFECT --- */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.4) 90%);
            z-index: 998; pointer-events: none;
        }
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }

        /* --- HEADER --- */
        .header {
            width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.8); border-bottom: 1px solid #333; z-index: 100;
        }
        .hud-val { font-size: 22px; font-weight: 900; color: var(--snake); text-shadow: 0 0 10px var(--glow); }
        .currency { color: #ffd700; text-shadow: 0 0 10px #ffd700; display: flex; align-items: center; gap: 5px; }

        /* --- ABILITY BAR --- */
        .ability-container {
            width: 90%; height: 6px; background: #333; margin-top: 10px; border-radius: 3px; overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 20;
        }
        .ability-fill {
            height: 100%; width: 100%; background: #00eaff; box-shadow: 0 0 10px #00eaff;
            transition: width 0.1s linear;
        }

        /* --- GAME AREA --- */
        #game-wrapper {
            position: relative; margin-top: 15px; z-index: 10;
            padding: 4px; border: 2px solid #333; border-radius: 14px; background: #000;
            box-shadow: 0 0 40px rgba(0,0,0,0.5); transition: border-color 0.3s;
        }
        body.slow-motion #game-wrapper { border-color: #00eaff; box-shadow: 0 0 50px #00eaff; }
        canvas { display: block; border-radius: 10px; }

        /* --- MENUS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: 0.2s; backdrop-filter: blur(8px);
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        /* SHOP GRID */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; margin: 20px 0; max-height: 40vh; overflow-y: auto; }
        .shop-item {
            background: #111; border: 2px solid #333; padding: 10px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative;
        }
        .shop-item.active { border-color: var(--snake); box-shadow: 0 0 15px var(--glow); }
        .shop-item.locked { opacity: 0.6; }
        .lock-icon { font-size: 20px; position: absolute; top: 35%; }
        .price-tag { font-size: 12px; color: #ffd700; margin-top: 5px; font-weight: bold; }

        .btn-main {
            background: var(--snake); color: #000; border: none; padding: 12px 50px; 
            font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px var(--glow); margin-top: 10px; text-transform: uppercase;
        }

        /* --- CONTROLS --- */
        .controls { margin-top: auto; margin-bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 20; }
        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 50%; border: 1px solid #333;
        }
        .d-btn { 
            width: 55px; height: 55px; background: #222; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 22px; 
            border: 2px solid #444; box-shadow: 0 4px 0 #111; transition: 0.05s; color: var(--snake);
        }
        .d-btn:active { transform: translateY(4px); box-shadow: none; background: #333; }
        
        .ability-btn {
            width: 60px; height: 60px; border-radius: 50%; background: #00eaff; color: #000;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
            box-shadow: 0 0 20px #00eaff; border: 2px solid #fff; position: absolute; right: 20px; bottom: 80px;
        }
        .ability-btn:active { transform: scale(0.9); }
        .ability-btn.cooldown { filter: grayscale(1); opacity: 0.5; }

        .shaking { animation: shake 0.3s; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 25% { transform: translate(-2px, -2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body class="skin-neon">
    <div class="scanlines"></div>

    <div class="header">
        <div class="hud-group">
            <div class="hud-val" id="score">0</div>
            <div style="font-size:10px; opacity:0.7;">SCORE</div>
        </div>
        <div class="hud-group currency">
            <span style="font-size:18px;">🪙</span>
            <div class="hud-val" id="bits" style="color:#ffd700; text-shadow:0 0 10px #ffd700;">0</div>
        </div>
    </div>
    
    <div class="ability-container"><div class="ability-fill" id="ability-bar"></div></div>

    <div id="menu-overlay" class="overlay">
        <h1 style="font-size:40px; color:var(--snake); text-shadow:0 0 20px var(--glow); margin-bottom:0;">SNAKE v5</h1>
        <p style="color:#888; font-size:12px; margin-bottom:20px;">PROGRESSION UPDATE</p>
        
        <div class="shop-grid" id="shop-grid">
            </div>

        <button class="btn-main" onclick="startGame()">PLAY</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <h1 style="color:#f00; font-size:40px;">CRASHED</h1>
        <div style="font-size:18px; color:#fff; margin-bottom:5px;">Score: <span id="final-score">0</span></div>
        <div style="font-size:16px; color:#ffd700; margin-bottom:20px;">Earned: +<span id="earned-bits">0</span> Bits</div>
        <button class="btn-main" onclick="startGame()">RETRY</button>
        <button onclick="showMenu()" style="margin-top:20px; background:none; border:1px solid #555; color:#aaa; padding:10px 20px; border-radius:20px;">SHOP</button>
    </div>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="340" height="340"></canvas>
        <div id="fx-container" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div></div>
            <div class="d-btn" ontouchstart="input('UP')" onmousedown="input('UP')">▲</div>
            <div></div>
            <div class="d-btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">◀</div>
            <div class="d-btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">▼</div>
            <div class="d-btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">▶</div>
        </div>
        <div id="ability-btn" class="ability-btn" onclick="activateAbility()">👁️</div>
    </div>
    <script>
        // --- CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = 17; const GRID_H = 17;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- DATA ---
        let bits = parseInt(localStorage.getItem('snakeBits')) || 0;
        let ownedSkins = JSON.parse(localStorage.getItem('snakeSkins')) || ['neon'];
        let currentSkin = localStorage.getItem('snakeCurrentSkin') || 'neon';

        const SKINS = {
            'neon': { name: 'NEON', price: 0, color: '#0f0' },
            'gold': { name: 'GOLD', price: 100, color: '#ffd700' },
            'ice':  { name: 'ICE',  price: 250, color: '#0ff' },
            'void': { name: 'VOID', price: 500, color: '#f00' }
        };

        // --- GAME STATE ---
        let snake=[], food={}, dir={x:0,y:-1}, nextDir={x:0,y:-1};
        let score=0, gameSpeed=130, baseSpeed=130;
        let lastTime=0, isRunning=false;
        
        // Ability: Focus Mode
        let canUseAbility = true;
        let isFocusMode = false;
        let abilityCooldown = 0;

        // --- INIT ---
        updateShopUI();
        setSkin(currentSkin);
        document.getElementById('bits').innerText = bits;

        // --- SHOP SYSTEM ---
        function updateShopUI() {
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = "";
            for (let key in SKINS) {
                let s = SKINS[key];
                let owned = ownedSkins.includes(key);
                let active = currentSkin === key;
                
                let div = document.createElement('div');
                div.className = `shop-item ${active ? 'active' : ''} ${!owned ? 'locked' : ''}`;
                div.onclick = () => trySelectSkin(key);
                
                div.innerHTML = `
                    <div style="width:30px; height:30px; background:${s.color}; border-radius:50%; margin-bottom:5px;"></div>
                    <span style="color:#fff; font-size:12px; font-weight:bold;">${s.name}</span>
                    ${!owned ? `<div class="lock-icon">🔒</div><div class="price-tag">${s.price} 🪙</div>` : ''}
                    ${active ? `<div style="font-size:10px; color:#0f0; margin-top:2px;">EQUIPPED</div>` : ''}
                `;
                grid.appendChild(div);
            }
        }

        function trySelectSkin(key) {
            if (ownedSkins.includes(key)) {
                setSkin(key);
                updateShopUI();
                sfx('tap');
            } else {
                if (bits >= SKINS[key].price) {
                    if(confirm(`Buy ${SKINS[key].name} for ${SKINS[key].price} bits?`)) {
                        bits -= SKINS[key].price;
                        ownedSkins.push(key);
                        localStorage.setItem('snakeBits', bits);
                        localStorage.setItem('snakeSkins', JSON.stringify(ownedSkins));
                        document.getElementById('bits').innerText = bits;
                        setSkin(key);
                        updateShopUI();
                        sfx('powerup');
                    }
                } else {
                    alert("Not enough bits! Play more to earn.");
                }
            }
        }

        function setSkin(name) {
            currentSkin = name;
            localStorage.setItem('snakeCurrentSkin', name);
            document.body.className = 'skin-' + name;
        }

        // --- ABILITY LOGIC ---
        function activateAbility() {
            if (!isRunning || !canUseAbility) return;
            
            // Slow Motion Effect
            isFocusMode = true;
            canUseAbility = false;
            gameSpeed = 300; // Slow down significantly
            document.body.classList.add('slow-motion');
            document.getElementById('ability-btn').classList.add('cooldown');
            sfx('powerup');

            // End Ability after 3s
            setTimeout(() => {
                isFocusMode = false;
                gameSpeed = baseSpeed;
                document.body.classList.remove('slow-motion');
                startCooldown();
            }, 3000);
        }

        function startCooldown() {
            let cd = 100; // 100% width
            let timer = setInterval(() => {
                cd -= 1;
                document.getElementById('ability-bar').style.width = cd + "%";
                if (cd <= 0) {
                    clearInterval(timer);
                    canUseAbility = true;
                    document.getElementById('ability-bar').style.width = "100%";
                    document.getElementById('ability-btn').classList.remove('cooldown');
                    sfx('tap'); // Ready sound
                }
            }, 100); // 10 seconds total cooldown
        }

        // --- GAME LOOP ---
        function startGame() {
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            
            snake = [{x:8, y:8}, {x:8, y:9}, {x:8, y:10}];
            dir = {x:0, y:-1}; nextDir = {x:0, y:-1};
            score = 0; baseSpeed = 130; gameSpeed = 130;
            canUseAbility = true;
            document.getElementById('score').innerText = 0;
            document.getElementById('ability-btn').classList.remove('cooldown');
            spawnFood();
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isRunning = true;
            lastTime = 0;
            requestAnimationFrame(loop);
            sfx('start');
        }

        function loop(timestamp) {
            if (!isRunning) return;
            if (timestamp - lastTime > gameSpeed) {
                update();
                lastTime = timestamp;
            }
            requestAnimationFrame(loop);
        }

        function update() {
            dir = nextDir;
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H) return gameOver();
            for(let p of snake) if(head.x === p.x && head.y === p.y) return gameOver();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = score;
                sfx('eat');
                if (baseSpeed > 60) baseSpeed -= 1;
                if (!isFocusMode) gameSpeed = baseSpeed;
                spawnFood();
            } else {
                snake.pop();
            }
            draw();
        }

        function draw() {
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Food
            let fc = getComputedStyle(document.body).getPropertyValue('--food');
            ctx.fillStyle = fc; ctx.shadowBlur = 15; ctx.shadowColor = fc;
            ctx.beginPath(); ctx.arc(food.x*BOX+10, food.y*BOX+10, 7, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

            // Snake
            let sc = getComputedStyle(document.body).getPropertyValue('--snake');
            snake.forEach((p, i) => {
                ctx.fillStyle = sc;
                if(i===0) { ctx.fillStyle = "#fff"; ctx.shadowBlur=20; ctx.shadowColor=sc; }
                else ctx.shadowBlur=0;
                ctx.fillRect(p.x*BOX+1, p.y*BOX+1, 18, 18);
            });
        }

        function spawnFood() {
            let valid = false;
            while(!valid) {
                food = { x: Math.floor(Math.random() * GRID_W), y: Math.floor(Math.random() * GRID_H) };
                valid = true;
                for(let p of snake) if(p.x === food.x && p.y === food.y) valid = false;
            }
        }

        function gameOver() {
            isRunning = false;
            sfx('die');
            document.body.classList.add('shaking');
            setTimeout(()=>document.body.classList.remove('shaking'), 300);
            
            // Economy
            bits += score;
            localStorage.setItem('snakeBits', bits);
            document.getElementById('bits').innerText = bits;
            document.getElementById('final-score').innerText = score;
            document.getElementById('earned-bits').innerText = score;
            
            document.getElementById('gameover-overlay').classList.remove('hidden');
        }

        function showMenu() {
            updateShopUI();
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
        }

        // --- INPUT ---
        function input(d) {
            if (d==='UP' && dir.y!==1) nextDir={x:0, y:-1};
            if (d==='DOWN' && dir.y!==-1) nextDir={x:0, y:1};
            if (d==='LEFT' && dir.x!==1) nextDir={x:-1, y:0};
            if (d==='RIGHT' && dir.x!==-1) nextDir={x:1, y:0};
        }
        let tX=0, tY=0;
        document.body.addEventListener('touchstart', e=>{tX=e.touches[0].clientX; tY=e.touches[0].clientY;}, {passive:false});
        document.body.addEventListener('touchend', e=>{
            let dX = e.changedTouches[0].clientX - tX, dY = e.changedTouches[0].clientY - tY;
            if(Math.abs(dX)>Math.abs(dY)) input(dX>0?'RIGHT':'LEFT'); else input(dY>0?'DOWN':'UP');
        }, {passive:false});

        // --- SFX ---
        function sfx(type) {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            if (type === 'eat') { osc.frequency.setValueAtTime(500, t); osc.frequency.linearRampToValueAtTime(1000, t+0.1); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.1); }
            else if (type === 'die') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(10, t+0.5); gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'powerup') { osc.type = 'square'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(600, t+0.5); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'start') { osc.type = 'square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.2); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.3); }
            osc.start(t); osc.stop(t+0.5);
        }
    </script>
</body>
</html>
