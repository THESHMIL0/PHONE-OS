<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Phone OS v2</title>
    <style>
        /* --- RESET & BODY --- */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            height: 100vh; width: 100vw;
        }

        /* --- PHONE LAYOUT --- */
        .phone-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            position: relative;
            background: linear-gradient(135deg, #1c1c1e, #000); /* Sleek dark gradient */
        }

        .status-bar {
            padding: 10px 20px;
            display: flex; justify-content: space-between;
            font-size: 14px; font-weight: 600;
            z-index: 100;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
            opacity: 1; z-index: 10;
            background: inherit; /* Matches phone container */
        }
        
        .screen.hidden { opacity: 0; pointer-events: none; z-index: 0; }

        /* --- LOCK SCREEN --- */
        input[type="password"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px; border-radius: 12px;
            color: white; font-size: 24px; text-align: center;
            width: 150px; margin: 20px 0; outline: none;
        }

        /* --- HOME SCREEN --- */
        .app-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 25px; padding: 20px;
        }
        .app-icon {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.1);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .app-icon:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* --- TIC-TAC-TOE STYLES --- */
        .ttt-board {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 20px;
        }
        .ttt-cell {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
        .ttt-cell:active { background: rgba(255,255,255,0.2); }

        /* --- SNAKE & CONTROLS --- */
        #game-canvas { background: #000; border: 2px solid #333; margin: 20px 0; }
        .controls { display: grid; grid-template-columns: 60px 60px 60px; gap: 10px; }
        .d-pad {
            width: 60px; height: 60px; background: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; border: 1px solid #444;
        }
        .d-pad:active { background: #555; }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        .back-btn {
            position: absolute; top: 50px; left: 20px;
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar">
            <span id="clock">12:00</span>
            <span>5G 🔋</span>
        </div>

        <div id="lock-screen" class="screen">
            <h2 style="font-weight: 300; margin-bottom: 10px;">Swipe up to unlock</h2>
            <div style="font-size: 40px; margin-bottom: 20px;">🔒</div>
            <input type="password" id="pass-input" maxlength="4" placeholder="••••">
            <button onclick="checkPass()" style="margin-top:10px; padding: 10px 30px; background: #0A84FF; border:none; color:white; border-radius: 20px; font-size:16px;">Enter</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <h3 style="margin-bottom: 30px; opacity: 0.7;">My Apps</h3>
            <div class="app-grid">
                <div class="app-icon" onclick="openGame('snake')">🐍</div>
                <div class="app-icon" onclick="openGame('ttt')">❌</div>
                <div class="app-icon" onclick="alert('Clicker Game coming in v3!')">🖱️</div>
            </div>
        </div>

        <div id="snake-screen" class="screen hidden" style="background: #000;">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <h2 id="snake-score">Score: 0</h2>
            <canvas id="game-canvas" width="300" height="300"></canvas>
            <div class="controls">
                <div class="d-pad up" onclick="setDir('UP')">⬆️</div>
                <div class="d-pad left" onclick="setDir('LEFT')">⬅️</div>
                <div class="d-pad down" onclick="setDir('DOWN')">⬇️</div>
                <div class="d-pad right" onclick="setDir('RIGHT')">➡️</div>
            </div>
        </div>

        <div id="ttt-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">← Back</button>
            <h2 id="ttt-status">Player X's Turn</h2>
            <div class="ttt-board" id="ttt-board">
                </div>
            <button onclick="startTTT()" style="margin-top: 20px; padding: 10px 20px; background: #32D74B; border: none; border-radius: 10px; color: white;">Restart</button>
        </div>
    </div>
    <script>
        const CORRECT_PASS = "1234";

        // --- SYSTEM ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function checkPass() {
            const input = document.getElementById('pass-input');
            if(input.value === CORRECT_PASS) {
                switchScreen('home-screen');
            } else {
                input.value = "";
                input.style.borderColor = "red";
                setTimeout(() => input.style.borderColor = "rgba(255,255,255,0.2)", 500);
            }
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function goHome() {
            clearInterval(gameInterval);
            switchScreen('home-screen');
        }

        function openGame(game) {
            if(game === 'snake') {
                switchScreen('snake-screen');
                canvas = document.getElementById('game-canvas');
                ctx = canvas.getContext('2d');
                startSnake();
            } else if (game === 'ttt') {
                switchScreen('ttt-screen');
                startTTT();
            }
        }

        // --- SNAKE LOGIC ---
        let canvas, ctx, gameInterval, snake, food, direction, score;
        const box = 20;

        function startSnake() {
            snake = [{x: 10 * box, y: 10 * box}];
            direction = "RIGHT"; score = 0;
            document.getElementById('snake-score').innerText = "Score: 0";
            spawnFood();
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateSnake, 150);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
        }

        function setDir(newDir) {
            if(newDir === 'LEFT' && direction !== 'RIGHT') direction = 'LEFT';
            if(newDir === 'UP' && direction !== 'DOWN') direction = 'UP';
            if(newDir === 'RIGHT' && direction !== 'LEFT') direction = 'RIGHT';
            if(newDir === 'DOWN' && direction !== 'UP') direction = 'DOWN';
        }

        function updateSnake() {
            let headX = snake[0].x; let headY = snake[0].y;
            if(direction === 'LEFT') headX -= box;
            if(direction === 'UP') headY -= box;
            if(direction === 'RIGHT') headX += box;
            if(direction === 'DOWN') headY += box;

            if(headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height || collision(headX, headY)) {
                clearInterval(gameInterval); alert("Game Over! Score: " + score); startSnake(); return;
            }

            if(headX === food.x && headY === food.y) {
                score++; document.getElementById('snake-score').innerText = "Score: " + score; spawnFood();
            } else { snake.pop(); }

            snake.unshift({x: headX, y: headY});
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, box, box);
            for(let i=0; i<snake.length; i++) {
                ctx.fillStyle = (i===0) ? "#32D74B" : "#28A745";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
        }

        function collision(x, y) {
            for(let i=0; i<snake.length; i++) if(snake[i].x === x && snake[i].y === y) return true;
            return false;
        }

        // --- TIC-TAC-TOE LOGIC ---
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;

        function startTTT() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X"; gameActive = true;
            document.getElementById('ttt-status').innerText = "Player X's Turn";
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('ttt-board');
            boardEl.innerHTML = "";
            board.forEach((cell, index) => {
                const cellEl = document.createElement('div');
                cellEl.classList.add('ttt-cell');
                cellEl.innerText = cell;
                cellEl.onclick = () => handleMove(index);
                if(cell === "X") cellEl.style.color = "#32D74B"; // Green X
                if(cell === "O") cellEl.style.color = "#FF3B30"; // Red O
                boardEl.appendChild(cellEl);
            });
        }

        function handleMove(index) {
            if(board[index] !== "" || !gameActive) return;
            board[index] = currentPlayer;
            renderBoard();
            checkWinner();
            if(gameActive) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                document.getElementById('ttt-status').innerText = `Player ${currentPlayer}'s Turn`;
                
                // Simple AI: If it's O's turn, make a random move after a delay
                if(currentPlayer === "O") {
                    setTimeout(makeComputerMove, 500);
                }
            }
        }

        function makeComputerMove() {
            if(!gameActive) return;
            let emptyCells = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            if(emptyCells.length > 0) {
                let randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                handleMove(randomIdx);
            }
        }

        function checkWinner() {
            const winConditions = [
                [0,1,2], [3,4,5], [6,7,8], 
                [0,3,6], [1,4,7], [2,5,8], 
                [0,4,8], [2,4,6]
            ];
            
            for(let condition of winConditions) {
                let [a, b, c] = condition;
                if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                    gameActive = false;
                    document.getElementById('ttt-status').innerText = `Player ${board[a]} Wins! 🎉`;
                    return;
                }
            }
            if(!board.includes("")) {
                gameActive = false;
                document.getElementById('ttt-status').innerText = "It's a Draw! 🤝";
            }
        }
    </script>
</body>
</html>
