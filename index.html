<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake v10 Perfect</title>
    <style>
        /* --- VARIABLES --- */
        :root { --bg: #050505; --case: #151515; --primary: #0f0; --accent: #00eaff; --text: #fff; --panel: #111; }
        
        /* SKINS */
        body.skin-neon { --primary: #0f0; --accent: #f0f; }
        body.skin-gold { --primary: #ffd700; --accent: #fff; }
        body.skin-ice { --primary: #00eaff; --accent: #fff; }
        body.skin-void { --primary: #ff0000; --accent: #500; --bg: #000; }
        body.skin-retro { --primary: #fff; --accent: #aaa; --bg: #000; }

        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        body { 
            margin: 0; background: #000; color: var(--text); 
            overflow: hidden; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
        }

        /* --- DEVICE FRAME --- */
        .device-bezel {
            width: 100%; height: 100%; max-width: 480px; background: var(--case);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
        }
        @media (min-width: 500px) {
            .device-bezel { height: 95vh; border-radius: 35px; border: 6px solid #222; box-shadow: 0 0 50px rgba(0,255,0,0.1); }
        }

        .screen-container {
            flex-grow: 1; position: relative; overflow: hidden; background: var(--bg);
            transition: background 0.3s; z-index: 10;
        }
        
        /* SCANLINES & VIGNETTE */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px;
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
        }

        /* --- NAVIGATION --- */
        .app-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10; padding: 20px;
        }
        .screen-hidden-left { transform: translateX(-100%) scale(0.9); opacity: 0; }
        .screen-hidden-right { transform: translateX(100%) scale(0.9); opacity: 0; }
        .screen-active { transform: translateX(0) scale(1); opacity: 1; z-index: 20; }

        /* --- MENU --- */
        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 40px; margin-bottom: 20px; z-index: 50; }
        .currency { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; color: #ffd700; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); font-size: 14px; display: flex; gap:5px; }
        
        .logo-main { 
            font-size: 65px; font-weight: 900; font-style: italic; color: var(--primary); 
            text-shadow: 0 0 20px var(--primary); letter-spacing: -4px; margin-top: 30px; 
            animation: glowPulse 3s infinite alternate;
        }
        @keyframes glowPulse { from { text-shadow: 0 0 20px var(--primary); } to { text-shadow: 0 0 40px var(--primary); } }

        .btn-play {
            width: 80%; padding: 20px; border-radius: 40px; border: none;
            background: var(--primary); color: #000; font-size: 24px; font-weight: 900;
            box-shadow: 0 0 20px var(--primary); cursor: pointer; text-transform: uppercase; margin: 15px 0;
            transition: transform 0.1s; letter-spacing: 1px;
        }
        .btn-play:active { transform: scale(0.95); }

        .icon-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .icon-btn { 
            width: 60px; height: 60px; background: rgba(255,255,255,0.05); border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; font-size: 26px; 
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.1s; 
        }
        .icon-btn:active { border-color: var(--primary); color: var(--primary); transform: scale(0.9); }

        /* --- SHOP GRID --- */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        .shop-item {
            background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative;
        }
        .shop-item.active { border-color: var(--primary); background: rgba(0,255,0,0.05); box-shadow: inset 0 0 15px rgba(0,255,0,0.1); }
        .shop-tag { position: absolute; top: 5px; right: 5px; font-size: 10px; background: #000; padding: 2px 5px; border-radius: 5px; }

        /* --- GAME UI --- */
        .game-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 5px; margin-bottom: 5px; }
        .score-big { font-size: 36px; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        
        .combo-bar-con { width: 100%; height: 6px; background: #222; border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
        .combo-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0, #f05); transition: width 0.1s linear; }

        canvas { 
            background: rgba(0,0,0,0.3); border: 2px solid #333; border-radius: 12px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5); width: 100%; aspect-ratio: 1; image-rendering: pixelated; 
        }

        /* --- CONTROLS (The Fix!) --- */
        .controls-area { 
            background: #111; padding: 15px; border-top: 2px solid #222; 
            display: flex; justify-content: center; position: relative; z-index: 100;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .controls-hidden { transform: translateY(120%); pointer-events: none; } /* Moves it off screen */

        .d-pad { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            background: #0a0a0a; padding: 12px; border-radius: 50%; border: 1px solid #333;
            box-shadow: inset 0 0 20px #000;
        }
        .d-btn { 
            width: 55px; height: 55px; background: #1f1f1f; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            border: 2px solid #333; color: var(--primary); cursor: pointer;
            box-shadow: 0 4px 0 #000; transition: 0.05s;
        }
        .d-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; border-color: var(--primary); background: #2a2a2a; }
        
        .ability-btn { 
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            width: 65px; height: 65px; border-radius: 50%; background: var(--accent); color:#000; 
            font-size: 28px; display: flex; align-items: center; justify-content: center; 
            border: 3px solid #fff; box-shadow: 0 0 20px var(--accent); cursor: pointer; transition: 0.2s;
        }
        .ability-btn:active { transform: translateY(-50%) scale(0.9); }
        .ability-btn.cooldown { filter: grayscale(1); opacity: 0.5; transform: translateY(-50%) scale(0.9); }

        /* --- MODAL --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-visible { opacity: 1; pointer-events: all; }
        .modal-box { background: #151515; border: 2px solid #333; padding: 30px; border-radius: 25px; text-align: center; width: 85%; transform: scale(0.8); transition: 0.3s; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal-visible .modal-box { transform: scale(1); }
        
        /* FX */
        .float-text { position: absolute; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 5px #000; font-size: 24px; z-index: 50; }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-50px); } }
        .shaking { animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 20% { transform: translate(-2px, -2px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-2px, 2px); } 100% { transform: translate(0, 0); } }
    </style>
</head>
<body class="skin-neon">
    <div class="device-bezel">
        <div class="screen-container">
            <div class="scanlines"></div>
            <div class="vignette"></div>

            <div id="screen-menu" class="app-screen screen-active">
                <div class="top-bar">
                    <div style="font-size:12px; color:#555; font-weight:bold;">SNAKE v10</div>
                    <div class="currency">🪙 <span id="menu-bits">0</span></div>
                </div>

                <div class="logo-main">SNAKE</div>
                <div style="color:#666; letter-spacing:4px; font-size:12px; margin-bottom:20px;">PERFECT EDITION</div>

                <div style="width:100%; display:flex; justify-content:center; gap:10px; margin-bottom:auto;">
                    <div id="mode-classic" class="icon-btn" style="width:auto; padding:0 15px; font-size:12px; font-weight:bold; border-color:var(--primary); color:var(--primary);" onclick="setMode('classic')">CLASSIC</div>
                    <div id="mode-campaign" class="icon-btn" style="width:auto; padding:0 15px; font-size:12px; font-weight:bold;" onclick="setMode('campaign')">CAMPAIGN</div>
                </div>

                <div style="margin-bottom:30px; width:100%; display:flex; flex-direction:column; align-items:center; gap:15px;">
                    <button class="btn-play" onclick="startGame()">▶ START</button>
                    
                    <div class="icon-grid">
                        <div class="icon-btn" onclick="nav('shop')">🛒</div>
                        <div class="icon-btn" onclick="nav('settings')">⚙️</div>
                        <div class="icon-btn" style="color:#ffd700; border-color:#ffd700;" onclick="claimDaily()" id="daily-btn">🎁</div>
                    </div>
                </div>
            </div>

            <div id="screen-shop" class="app-screen screen-hidden-right">
                <div class="top-bar">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:20px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">MARKETPLACE</div>
                    <div class="currency">🪙 <span id="shop-bits">0</span></div>
                </div>
                
                <div style="width:100%; font-size:12px; color:#666; margin-bottom:10px;">SKINS & SHAPES</div>
                <div id="shop-grid" class="shop-grid"></div>
            </div>

            <div id="screen-settings" class="app-screen screen-hidden-right">
                <div class="top-bar">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:20px;" onclick="nav('menu')">←</div>
                    <div style="font-weight:bold;">SETTINGS</div>
                    <div style="width:40px;"></div>
                </div>
                
                <div style="display:flex; flex-direction:column; gap:15px; width:100%;">
                    <div class="shop-item" onclick="toggleSetting('sound')">
                        <div style="font-weight:bold;">🔊 SOUND EFFECTS</div>
                        <div style="color:var(--primary);" id="opt-sound">ON</div>
                    </div>
                    <div class="shop-item" onclick="toggleSetting('music')">
                        <div style="font-weight:bold;">🎵 MUSIC (BGM)</div>
                        <div style="color:var(--primary);" id="opt-music">OFF</div>
                    </div>
                    <div class="shop-item" onclick="toggleSetting('vibro')">
                        <div style="font-weight:bold;">📳 HAPTICS</div>
                        <div style="color:var(--primary);" id="opt-vibro">ON</div>
                    </div>
                    <div class="shop-item" style="border-color:#f00;" onclick="resetData()">
                        <div style="font-weight:bold; color:#f00;">⚠️ FACTORY RESET</div>
                    </div>
                </div>
            </div>

            <div id="screen-game" class="app-screen screen-hidden-right" style="padding:10px;">
                <div class="game-hud">
                    <div class="icon-btn" style="width:40px; height:40px; font-size:16px;" onclick="pauseGame()">ll</div>
                    <div style="text-align:right;">
                        <div class="score-big" id="game-score">0</div>
                        <div style="font-size:10px; color:#888;" id="level-indicator">ENDLESS MODE</div>
                    </div>
                </div>
                
                <div class="combo-bar-con"><div class="combo-fill" id="combo-bar"></div></div>
                
                <div style="position:relative; width:100%; display:flex; justify-content:center;">
                    <canvas id="game-canvas" width="360" height="360"></canvas>
                    <div id="fx-layer" style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:360px; height:360px; pointer-events:none;"></div>
                </div>
            </div>

            <div id="modal-gameover" class="modal-overlay">
                <div class="modal-box">
                    <h1 style="color:#f00; margin:0; font-size:35px;">CRASHED!</h1>
                    <div style="font-size:18px; color:#fff; margin:10px 0;">SCORE: <span id="final-score">0</span></div>
                    <div style="background:#222; padding:10px; border-radius:10px; margin-bottom:20px; color:#ffd700; font-weight:bold;">
                        +<span id="final-bits">0</span> 🪙 EARNED
                    </div>
                    <div class="btn-play" style="width:100%; font-size:18px; padding:15px; margin:0;" onclick="restartGame()">RETRY</div>
                    <div class="icon-btn" style="width:100%; border-radius:30px; font-size:14px; margin-top:15px;" onclick="nav('menu'); hideModal()">EXIT TO MENU</div>
                </div>
            </div>
        </div>

        <div class="controls-area controls-hidden" id="controls">
            <div class="d-pad">
                <div></div><div class="d-btn" ontouchstart="input('UP')" onmousedown="input('UP')">▲</div><div></div>
                <div class="d-btn" ontouchstart="input('LEFT')" onmousedown="input('LEFT')">◀</div>
                <div class="d-btn" ontouchstart="input('DOWN')" onmousedown="input('DOWN')">▼</div>
                <div class="d-btn" ontouchstart="input('RIGHT')" onmousedown="input('RIGHT')">▶</div>
            </div>
            <div id="ability-btn" class="ability-btn" onclick="activateAbility()">⏳</div>
        </div>
    </div>
    <script>
        // --- DATA & CONFIG ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const BOX = 20;
        const GRID_W = 18; const GRID_H = 18;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let user = {
            bits: parseInt(localStorage.getItem('snake_bits')) || 0,
            skins: JSON.parse(localStorage.getItem('snake_skins')) || ['neon'],
            skin: localStorage.getItem('snake_skin') || 'neon',
            settings: JSON.parse(localStorage.getItem('snake_settings')) || { sound: true, music: false, vibro: true },
            lastDaily: parseInt(localStorage.getItem('snake_daily')) || 0,
            highScore: parseInt(localStorage.getItem('snake_high')) || 0
        };

        const SKINS = {
            'neon': { name: 'Neon', price: 0, color: '#0f0', shape: 'square' },
            'gold': { name: 'Gold', price: 300, color: '#ffd700', shape: 'circle' },
            'ice':  { name: 'Ice',  price: 500, color: '#00eaff', shape: 'square' },
            'void': { name: 'Void', price: 1000, color: '#f00', shape: 'diamond' },
            'retro':{ name: 'Retro', price: 100, color: '#fff', shape: 'square' }
        };

        // Game State
        let snake=[], food={}, walls=[], dir={x:0,y:0}, nextDir={x:0,y:0};
        let score=0, speed=130, isRunning=false, gameLoop, slowMo=false;
        let combo=1, comboTimer=0, maxComboTime=3000;
        let bgmOsc = null, bgmGain = null;

        // --- INITIALIZATION ---
        window.onload = () => { updateUI(); checkDaily(); };

        function updateUI() {
            document.getElementById('menu-bits').innerText = user.bits;
            document.body.className = `skin-${user.skin}`;
            // Update Settings Text
            document.getElementById('opt-sound').innerText = user.settings.sound ? "ON" : "OFF";
            document.getElementById('opt-music').innerText = user.settings.music ? "ON" : "OFF";
            document.getElementById('opt-vibro').innerText = user.settings.vibro ? "ON" : "OFF";
        }

        // --- NAVIGATION (UI FIX HERE) ---
        function nav(screen) {
            document.querySelectorAll('.app-screen').forEach(s => {
                s.classList.remove('screen-active'); s.classList.add('screen-hidden-left');
            });
            let target = document.getElementById('screen-'+screen);
            target.classList.remove('screen-hidden-left', 'screen-hidden-right');
            target.classList.add('screen-active');
            
            // CONTROLS VISIBILITY LOGIC
            const controls = document.getElementById('controls');
            if (screen === 'game') {
                controls.classList.remove('controls-hidden');
            } else {
                controls.classList.add('controls-hidden');
                stopBGM(); // Stop music if leaving game
            }

            if(screen === 'shop') loadShop();
            if(screen === 'menu') updateUI();
            sfx('swish');
        }

        function hideModal() { document.getElementById('modal-gameover').classList.remove('modal-visible'); }

        // --- SHOP ---
        function loadShop() {
            document.getElementById('shop-bits').innerText = user.bits;
            const grid = document.getElementById('shop-grid'); grid.innerHTML = "";
            for (let id in SKINS) {
                let s = SKINS[id], owned = user.skins.includes(id), active = user.skin === id;
                let el = document.createElement('div');
                el.className = `shop-item ${active?'active':''}`;
                el.onclick = () => buySkin(id);
                el.innerHTML = `
                    <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                        <div style="width:20px;height:20px;background:${s.color};border-radius:${s.shape==='circle'?'50%':s.shape==='diamond'?'0':'4px'};transform:${s.shape==='diamond'?'rotate(45deg)':''}; box-shadow:0 0 10px ${s.color}"></div>
                        ${owned ? (active ? '<span style="color:#0f0;font-size:10px;">EQUIPPED</span>' : '') : '<span class="shop-tag">LOCKED</span>'}
                    </div>
                    <div style="font-size:12px;font-weight:bold;color:#fff;">${s.name}</div>
                    ${!owned ? `<div style="font-size:10px;color:#ffd700;">${s.price} 🪙</div>` : ''}
                `;
                grid.appendChild(el);
            }
        }

        function buySkin(id) {
            if (user.skins.includes(id)) { user.skin = id; saveData(); loadShop(); updateUI(); sfx('tap'); }
            else if (user.bits >= SKINS[id].price) {
                if(confirm("Buy "+SKINS[id].name+"?")) {
                    user.bits -= SKINS[id].price; user.skins.push(id); user.skin = id;
                    saveData(); loadShop(); sfx('buy');
                }
            }
        }

        // --- SETTINGS ---
        function toggleSetting(k) {
            user.settings[k] = !user.settings[k];
            updateUI(); saveData(); sfx('tap');
            if(k==='music' && isRunning) { if(user.settings.music) startBGM(); else stopBGM(); }
        }
        function saveData() {
            localStorage.setItem('snake_bits', user.bits);
            localStorage.setItem('snake_skins', JSON.stringify(user.skins));
            localStorage.setItem('snake_skin', user.skin);
            localStorage.setItem('snake_settings', JSON.stringify(user.settings));
            localStorage.setItem('snake_daily', user.lastDaily);
        }
        function resetData() { localStorage.clear(); location.reload(); }

        function checkDaily() {
            if (Date.now() - user.lastDaily > 86400000) { 
                document.getElementById('daily-btn').style.opacity = 1; 
                document.getElementById('daily-btn').innerText = "🎁";
            } else {
                document.getElementById('daily-btn').style.opacity = 0.3;
            }
        }
        function claimDaily() {
            if (Date.now() - user.lastDaily > 86400000) {
                user.bits += 100; user.lastDaily = Date.now(); saveData();
                checkDaily(); sfx('buy'); alert("+100 Bits!"); updateUI();
            }
        }

        // --- AUDIO SYSTEM ---
        function sfx(type) {
            if(!user.settings.sound) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;
            
            if (type === 'eat') { osc.frequency.setValueAtTime(600+(combo*50), t); osc.frequency.linearRampToValueAtTime(1200, t+0.1); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.1); }
            else if (type === 'die') { osc.type='sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(50, t+0.5); gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t+0.5); }
            else if (type === 'tap') { osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.05); }
            else if (type === 'buy') { osc.type='square'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(800, t+0.3); gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.3); }
            osc.start(t); osc.stop(t+0.5);
        }

        function startBGM() {
            if(!user.settings.music || bgmOsc) return;
            bgmOsc = audioCtx.createOscillator();
            bgmGain = audioCtx.createGain();
            bgmOsc.connect(bgmGain); bgmGain.connect(audioCtx.destination);
            bgmOsc.type = 'triangle';
            bgmOsc.frequency.setValueAtTime(110, audioCtx.currentTime);
            bgmGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            
            // Simple LFO effect for rhythm
            let lfo = audioCtx.createOscillator();
            lfo.frequency.value = 4; // 4Hz pulse
            let lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 50;
            lfo.connect(lfoGain); lfoGain.connect(bgmOsc.frequency);
            lfo.start();
            bgmOsc.start();
        }
        function stopBGM() {
            if(bgmOsc) { bgmOsc.stop(); bgmOsc = null; }
        }
        // --- GAME ENGINE ---
        function startGame() {
            hideModal();
            snake = [{x:8, y:10}, {x:8, y:11}, {x:8, y:12}];
            dir = {x:0, y:-1}; nextDir = {x:0, y:-1};
            score = 0; combo = 1; comboTimer = 0;
            speed = 130; isRunning = true; slowMo = false;
            
            document.getElementById('game-score').innerText = 0;
            document.getElementById('combo-bar').style.width = "0%";
            document.getElementById('ability-btn').classList.remove('cooldown');
            
            spawnFood();
            if(user.settings.music) startBGM();
            
            lastTime = 0;
            requestAnimationFrame(loop);
        }

        function loop(timestamp) {
            if(!isRunning) return;
            
            // Combo Logic
            if(combo > 1) {
                comboTimer -= (timestamp - lastTime);
                let pct = Math.max(0, (comboTimer/3000)*100);
                document.getElementById('combo-bar').style.width = pct + "%";
                if(comboTimer <= 0) { combo=1; }
            }

            let interval = slowMo ? 300 : speed;
            if (timestamp - lastTime > interval) {
                update();
                lastTime = timestamp;
            }
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            dir = nextDir;
            let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            // Walls & Self
            if(head.x < 0 || head.x >= GRID_W || head.y < 0 || head.y >= GRID_H || checkSelf(head)) {
                return gameOver();
            }

            snake.unshift(head);

            if(head.x === food.x && head.y === food.y) {
                combo++; comboTimer = 3000;
                let pts = combo; score += pts;
                document.getElementById('game-score').innerText = score;
                sfx('eat');
                spawnFloatText(head.x, head.y, "+"+pts, '#fff');
                
                if(speed > 60) speed -= 1;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);

            // Food
            let fc = "#f05";
            ctx.fillStyle = fc; ctx.shadowBlur = 15; ctx.shadowColor = fc;
            ctx.beginPath(); ctx.arc(food.x*BOX+10, food.y*BOX+10, 7, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            let sc = getComputedStyle(document.body).getPropertyValue('--primary');
            let shape = SKINS[user.skin].shape;
            
            snake.forEach((p,i)=>{
                ctx.fillStyle = sc;
                if(i===0) { ctx.fillStyle="#fff"; ctx.shadowBlur=15; ctx.shadowColor=sc; }
                else ctx.shadowBlur=0;
                
                let x = p.x*BOX+1, y = p.y*BOX+1;
                if(shape === 'circle') {
                    ctx.beginPath(); ctx.arc(x+9, y+9, 9, 0, Math.PI*2); ctx.fill();
                } else if(shape === 'diamond') {
                    ctx.beginPath(); ctx.moveTo(x+9, y); ctx.lineTo(x+18, y+9); ctx.lineTo(x+9, y+18); ctx.lineTo(x, y+9); ctx.fill();
                } else {
                    ctx.fillRect(x, y, 18, 18);
                }
            });
        }

        function spawnFood() {
            let valid=false;
            while(!valid) {
                food = {x:Math.floor(Math.random()*GRID_W), y:Math.floor(Math.random()*GRID_H)};
                valid=true;
                for(let p of snake) if(p.x===food.x && p.y===food.y) valid=false;
            }
        }

        function checkSelf(h) { for(let p of snake) if(p.x===h.x && p.y===h.y) return true; return false; }

        function gameOver() {
            isRunning = false;
            stopBGM(); sfx('die');
            if(user.settings.vibro) navigator.vibrate(300);
            
            user.bits += score; saveData();
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-bits').innerText = "+"+score;
            document.getElementById('modal-gameover').classList.add('modal-visible');
        }

        function restartGame() { hideModal(); startGame(); }
        function pauseGame() { 
            isRunning = !isRunning; 
            if(isRunning) { lastTime = 0; requestAnimationFrame(loop); if(user.settings.music) startBGM(); }
            else { stopBGM(); alert("PAUSED"); lastTime = performance.now(); } // Simple pause
        }

        function activateAbility() {
            if(!isRunning || slowMo) return;
            slowMo = true;
            document.getElementById('ability-btn').classList.add('cooldown');
            document.getElementById('fx-layer').style.backdropFilter = "hue-rotate(90deg)";
            sfx('buy');
            setTimeout(()=>{
                slowMo = false;
                document.getElementById('fx-layer').style.backdropFilter = "none";
                setTimeout(()=>{document.getElementById('ability-btn').classList.remove('cooldown');}, 5000);
            }, 3000);
        }

        function spawnFloatText(x, y, txt, col) {
            let el = document.createElement('div');
            el.className = 'float-text'; el.innerText = txt; el.style.color = col;
            el.style.left = (x*20+10)+'px'; el.style.top = (y*20+10)+'px';
            document.getElementById('fx-layer').appendChild(el);
            setTimeout(()=>el.remove(), 800);
        }

        // --- INPUT ---
        function input(d) {
            if(d==='UP' && dir.y!==1) nextDir={x:0, y:-1};
            if(d==='DOWN' && dir.y!==-1) nextDir={x:0, y:1};
            if(d==='LEFT' && dir.x!==1) nextDir={x:-1, y:0};
            if(d==='RIGHT' && dir.x!==-1) nextDir={x:1, y:0};
        }
        function setMode(m) {
            // Placeholder for modes if you want to expand later
            document.getElementById('level-indicator').innerText = m.toUpperCase() + " MODE";
            sfx('tap');
        }
    </script>
</body>
</html>
