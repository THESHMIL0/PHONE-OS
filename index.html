<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonic Game OS</title>
    <style>
        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        
        /* --- UTILS --- */
        .hidden { display: none !important; }

        /* --- TURBO FX --- */
        body.turbo .phone-container { border-color: #f00; animation: shake 0.5s infinite; }
        body.turbo { color: #f00; text-shadow: 2px 0 yellow; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        /* --- PHONE --- */
        .phone-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            background: linear-gradient(to bottom, #111, #000);
            border: 2px solid #333; transition: 0.3s; position: relative;
        }
        .status-bar { 
            padding: 10px 20px; display: flex; justify-content: space-between; 
            background: #111; border-bottom: 1px solid #333; font-weight: bold; color: #0f0; 
            height: 50px; align-items: center;
        }
        
        /* --- SCREENS --- */
        .screen {
            position: absolute; top: 50px; left: 0; width: 100%; height: calc(100% - 50px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 10; transition: 0.2s;
        }

        /* --- MENU --- */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; width: 100%; overflow-y: auto; }
        .app-icon {
            aspect-ratio: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 30px; cursor: pointer; transition: 0.1s;
        }
        .app-icon:active { transform: scale(0.9); background: #333; border-color: #0f0; }
        .app-icon span { font-size: 10px; margin-top: 5px; opacity: 0.7; }

        /* --- GAME CONTROLS --- */
        .back-btn { position: absolute; top: 10px; left: 10px; background: #222; color: white; border: 1px solid #444; padding: 5px 15px; border-radius: 5px; z-index: 20; }
        canvas { background: #000; border: 2px solid #333; max-width: 100%; image-rendering: pixelated; }
        .controls { display: flex; gap: 15px; margin-top: 15px; }
        .btn { width: 65px; height: 65px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 1px solid #444; }
        .btn:active { background: #444; transform: scale(0.95); }

        /* --- OVERLAY --- */
        .game-over-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            backdrop-filter: blur(5px);
        }
        .game-over-box {
            background: #222; border: 1px solid #444; padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 0 30px rgba(0,255,0,0.2); width: 85%;
        }
        .restart-btn {
            background: #0f0; color: black; border: none; padding: 12px 30px;
            border-radius: 25px; font-weight: bold; font-size: 18px; margin-top: 20px;
            cursor: pointer; width: 100%;
        }

        /* --- GAMES SPECIFIC --- */
        .ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ttt-cell { width: 80px; height: 80px; background: #111; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 1px solid #333; }
        .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .mem-card { width: 60px; height: 60px; background: #222; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .coin-btn { width: 140px; height: 140px; border-radius: 50%; background: gold; color: black; font-size: 60px; display: flex; align-items: center; justify-content: center; border: 6px solid orange; box-shadow: 0 0 30px gold; }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="status-bar">
            <span>GAME OS v11</span>
            <div onclick="toggleTurbo()" style="border:1px solid #333; padding:5px 10px; border-radius:10px; font-size:12px; cursor:pointer;">
                <span id="turbo-badge" style="color:#555">TURBO: OFF</span>
            </div>
            <span>🔋</span>
        </div>

        <div id="game-overlay" class="game-over-overlay hidden">
            <div class="game-over-box">
                <h2 id="overlay-title" style="margin:0 0 10px 0; color:#ff4444;">GAME OVER</h2>
                <div id="overlay-msg" style="font-size:18px; color:#ccc;">Score: 0</div>
                <div id="overlay-hiscore" style="font-size:14px; color:gold; margin-top:5px;">Best: 0</div>
                <button class="restart-btn" onclick="restartCurrentGame()">TRY AGAIN</button>
                <button class="restart-btn" style="background:#333; color:white; margin-top:10px;" onclick="closeOverlay(); goHome();">EXIT</button>
            </div>
        </div>

        <div id="lock-screen" class="screen">
            <h1>WELCOME</h1>
            <input type="password" id="pass-input" maxlength="4" placeholder="••••" style="background:transparent; border:none; border-bottom:2px solid #0f0; color:white; font-size:30px; text-align:center; width:100px; margin:20px;">
            <button onclick="unlock()" style="padding:10px 30px; background:#0f0; border:none; font-weight:bold;">PLAY</button>
        </div>

        <div id="home-screen" class="screen hidden">
            <div class="app-grid">
                <div class="app-icon" onclick="openApp('snake')">🐍<span>Snake</span></div>
                <div class="app-icon" onclick="openApp('space')">🚀<span>Space</span></div>
                <div class="app-icon" onclick="openApp('runner')">🏃<span>Dash</span></div>
                <div class="app-icon" onclick="openApp('ttt')">❌<span>TicTac</span></div>
                <div class="app-icon" onclick="openApp('memory')">🧠<span>Memory</span></div>
                <div class="app-icon" onclick="openApp('clicker')">💰<span>Tycoon</span></div>
            </div>
        </div>

        <div id="snake-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <h3>Score: <span id="snake-score">0</span></h3>
            <canvas id="snake-canvas" width="300" height="300"></canvas>
            <div class="controls">
                <div class="btn" onclick="setDir('LEFT')">⬅️</div>
                <div class="btn" onclick="setDir('UP')">⬆️</div>
                <div class="btn" onclick="setDir('DOWN')">⬇️</div>
                <div class="btn" onclick="setDir('RIGHT')">➡️</div>
            </div>
        </div>

        <div id="space-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <canvas id="space-canvas" width="300" height="400"></canvas>
            <div class="controls">
                <div class="btn" ontouchstart="moveShip(-1)" ontouchend="stopShip()" onmousedown="moveShip(-1)" onmouseup="stopShip()">⬅️</div>
                <div class="btn" style="border-color:red; color:red;" onclick="fireLaser()">🔥</div>
                <div class="btn" ontouchstart="moveShip(1)" ontouchend="stopShip()" onmousedown="moveShip(1)" onmouseup="stopShip()">➡️</div>
            </div>
        </div>

        <div id="runner-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <h2 id="run-score">0</h2>
            <canvas id="run-canvas" width="300" height="200"></canvas>
            <div style="width:300px; height:100px; border:1px dashed #555; display:flex; align-items:center; justify-content:center; margin-top:10px; border-radius:10px;" onmousedown="jump()" ontouchstart="jump()">TAP TO JUMP</div>
        </div>

        <div id="ttt-screen" class="screen hidden">
            <button class="back-btn" onclick="goHome()">EXIT</button>
            <h2 id="ttt-msg">VS CPU</h2>
            <div id="ttt-board" class="ttt-board"></div>
            <button onclick="startTTT()" style="margin-top:20px; padding:10px 30px; background:#0f0; border:none; border-radius:5px;">RESTART</button>
        </div>

        <div id="memory-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">EXIT</button><div id="mem-grid" class="mem-grid"></div></div>
        <div id="clicker-screen" class="screen hidden"><button class="back-btn" onclick="goHome()">EXIT</button><h1 id="money-display" style="color:gold">$0</h1><div class="coin-btn" onclick="clickCoin()">$</div></div>
    </div>
    <script>
        const PASS = "1234";
        let turbo = false;
        let money = parseInt(localStorage.getItem('money')) || 0;
        let currentGame = '';
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- AUDIO ENGINE ---
        function sfx(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'shoot') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- SYSTEM ---
        function unlock() { if(document.getElementById('pass-input').value === PASS) { switchScreen('home-screen'); sfx('win'); } }
        function goHome() { stopAllGames(); closeOverlay(); switchScreen('home-screen'); }
        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function toggleTurbo() {
            turbo = !turbo;
            document.body.classList.toggle('turbo');
            const badge = document.getElementById('turbo-badge');
            badge.innerText = turbo ? "TURBO: ON" : "TURBO: OFF";
            badge.style.color = turbo ? "red" : "#555";
            if(turbo) sfx('shoot');
        }

        // --- OVERLAY ---
        function showGameOver(title, score, game) {
            sfx('die');
            let hiscore = parseInt(localStorage.getItem(game+'High')) || 0;
            if(score > hiscore) { hiscore = score; localStorage.setItem(game+'High', hiscore); }
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-msg').innerText = "Score: " + score;
            document.getElementById('overlay-hiscore').innerText = "High Score: " + hiscore;
            document.getElementById('game-overlay').classList.remove('hidden');
            currentGame = game;
        }
        function closeOverlay() { document.getElementById('game-overlay').classList.add('hidden'); }
        function restartCurrentGame() {
            closeOverlay();
            if(currentGame === 'snake') startSnake();
            if(currentGame === 'runner') startRunner();
            if(currentGame === 'space') startSpace();
        }
        function openApp(app) {
            switchScreen(app+'-screen');
            if(app==='snake') startSnake();
            if(app==='space') startSpace();
            if(app==='runner') startRunner();
            if(app==='ttt') startTTT();
            if(app==='memory') startMemory();
            if(app==='clicker') updateMoney();
        }
        function stopAllGames() { clearInterval(snakeInt); cancelAnimationFrame(spaceLoop); cancelAnimationFrame(runLoop); }

        // --- PARTICLES ---
        let particles = [];
        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) particles.push({x:x, y:y, dx:(Math.random()-0.5)*5, dy:(Math.random()-0.5)*5, life:1.0, color:color});
        }
        function drawParticles(ctx) {
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i]; p.x += p.dx; p.y += p.dy; p.life -= 0.05;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1.0;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- SNAKE ---
        let snake, food, sDir, snakeInt;
        function startSnake() {
            const ctx = document.getElementById('snake-canvas').getContext('2d');
            snake=[{x:100,y:100}]; sDir='RIGHT'; spawnFood(); particles=[];
            if(snakeInt) clearInterval(snakeInt);
            snakeInt = setInterval(()=>updateSnake(ctx), turbo?50:150);
        }
        function spawnFood() { food={x:Math.floor(Math.random()*15)*20, y:Math.floor(Math.random()*15)*20}; }
        function setDir(d) {
            if(d==='LEFT' && sDir!=='RIGHT') sDir='LEFT';
            if(d==='UP' && sDir!=='DOWN') sDir='UP';
            if(d==='RIGHT' && sDir!=='LEFT') sDir='RIGHT';
            if(d==='DOWN' && sDir!=='UP') sDir='DOWN';
        }
        function updateSnake(ctx) {
            let h={x:snake[0].x, y:snake[0].y};
            if(sDir==='LEFT') h.x-=20; if(sDir==='UP') h.y-=20;
            if(sDir==='RIGHT') h.x+=20; if(sDir==='DOWN') h.y+=20;
            
            if(h.x<0||h.x>=300||h.y<0||h.y>=300||snake.some(s=>s.x===h.x&&s.y===h.y)) { 
                clearInterval(snakeInt); showGameOver("GAME OVER", snake.length, 'snake'); return; 
            }
            if(h.x===food.x && h.y===food.y) { 
                spawnFood(); sfx('win'); createExplosion(h.x, h.y, 'gold'); 
                document.getElementById('snake-score').innerText=snake.length; 
            } else snake.pop();
            snake.unshift(h);
            ctx.fillStyle="#000"; ctx.fillRect(0,0,300,300);
            ctx.fillStyle="red"; ctx.fillRect(food.x,food.y,18,18);
            ctx.fillStyle="#0f0"; snake.forEach(s=>ctx.fillRect(s.x,s.y,18,18));
            drawParticles(ctx);
        }

        // --- SPACE SHOOTER ---
        let ship, bullets=[], aliens=[], spaceLoop, spaceScore=0;
        function startSpace() {
            ship={x:135,dx:0}; bullets=[]; aliens=[]; spaceScore=0; particles=[];
            loopSpace(document.getElementById('space-canvas').getContext('2d'));
        }
        function moveShip(d) { ship.dx=d*5; }
        function stopShip() { ship.dx=0; }
        function fireLaser() { bullets.push({x:ship.x+12,y:360}); sfx('shoot'); }
        function loopSpace(ctx) {
            ctx.fillStyle="#000"; ctx.fillRect(0,0,300,400);
            ship.x+=ship.dx;
            if(ship.x<0) ship.x=0; if(ship.x>270) ship.x=270;
            ctx.fillStyle="#0ff"; ctx.fillRect(ship.x,370,30,30);
            bullets.forEach((b,i)=>{ b.y-=10; ctx.fillStyle="yellow"; ctx.fillRect(b.x,b.y,5,10); if(b.y<0) bullets.splice(i,1); });
            if(Math.random()<0.03) aliens.push({x:Math.random()*270,y:0});
            for(let i=0; i<aliens.length; i++) {
                let a = aliens[i];
                a.y+=(turbo?4:2); ctx.fillStyle="red"; ctx.fillRect(a.x,a.y,20,20);
                bullets.forEach((b,j)=>{ 
                    if(b.x>a.x&&b.x<a.x+20&&b.y<a.y+20) { 
                        aliens.splice(i,1); bullets.splice(j,1); spaceScore+=10; 
                        sfx('die'); createExplosion(a.x, a.y, 'orange');
                    } 
                });
                if(a.y>370) { cancelAnimationFrame(spaceLoop); showGameOver("INVASION!", spaceScore, 'space'); return; }
            }
            drawParticles(ctx);
            spaceLoop = requestAnimationFrame(()=>loopSpace(ctx));
        }

        // --- RUNNER ---
        let dino, obstacles=[], runLoop, rScore=0;
        function startRunner() {
            dino={y:160,dy:0,jump:false}; obstacles=[]; rScore=0; particles=[];
            loopRunner(document.getElementById('run-canvas').getContext('2d'));
        }
        function jump() { if(!dino.jump) { dino.dy=-10; dino.jump=true; sfx('jump'); } }
        function loopRunner(ctx) {
            dino.dy+=0.6; dino.y+=dino.dy;
            if(dino.y>160) { dino.y=160; dino.dy=0; dino.jump=false; }
            if(Math.random()<0.02) obstacles.push({x:300});
            ctx.fillStyle="#000"; ctx.fillRect(0,0,300,200);
            ctx.fillStyle="#0ff"; ctx.fillRect(30,dino.y,20,20);
            for(let i=0; i<obstacles.length; i++) {
                let o = obstacles[i];
                o.x-=(turbo?8:5); ctx.fillStyle="red"; ctx.fillRect(o.x,160,20,40);
                if(o.x<50 && o.x>10 && dino.y>140) { cancelAnimationFrame(runLoop); showGameOver("CRASHED!", rScore, 'runner'); return; }
            }
            rScore++; document.getElementById('run-score').innerText=rScore;
            runLoop = requestAnimationFrame(()=>loopRunner(ctx));
        }

        // --- CLICKER & TTT & MEMORY ---
        function clickCoin() { money += (turbo?2:1); localStorage.setItem('money', money); updateMoney(); sfx('win'); }
        function updateMoney() { document.getElementById('money-display').innerText = "$" + money; }
        
        let board=[], turn='X', active=true;
        function startTTT() {
            board=Array(9).fill(""); active=true; turn='X';
            const el=document.getElementById('ttt-board'); el.innerHTML="";
            board.forEach((_,i)=>{ let c=document.createElement('div'); c.className='ttt-cell'; c.onclick=()=>moveTTT(i,c); el.appendChild(c); });
            document.getElementById('ttt-msg').innerText = "VS CPU";
        }
        function moveTTT(i,c) {
            if(board[i] || !active) return;
            board[i]=turn; c.innerText=turn; c.style.color = turn==='X'?'#0f0':'#f00'; sfx('jump');
            if(checkWin(turn)) { active=false; document.getElementById('ttt-msg').innerText=turn+" WINS!"; sfx('win'); return; }
            if(!board.includes("")) { active=false; document.getElementById('ttt-msg').innerText="DRAW"; return; }
            turn = turn==='X'?'O':'X';
            if(turn==='O') setTimeout(()=>{
                let empty = board.map((v,k)=>v===""?k:null).filter(v=>v!==null);
                if(empty.length) document.getElementById('ttt-board').children[empty[Math.floor(Math.random()*empty.length)]].click();
            }, turbo?100:500);
        }
        function checkWin(p) { return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(w=>board[w[0]]===p && board[w[1]]===p && board[w[2]]===p); }

        let cards=[], flipped=[], matched=[];
        const emojis = ['🍎','🍎','👻','👻','⚡','⚡','💎','💎','🚀','🚀','🎮','🎮'];
        function startMemory() {
            const g=document.getElementById('mem-grid'); g.innerHTML=""; flipped=[]; matched=[];
            cards = emojis.sort(()=>Math.random()-0.5);
            cards.forEach((e,i)=>{ let c=document.createElement('div'); c.className='mem-card'; c.onclick=()=>flipCard(c,e); g.appendChild(c); });
        }
        function flipCard(c,e) {
            if(flipped.length<2 && !flipped.includes(c) && !matched.includes(c)) {
                c.innerText=e; c.style.background='#fff'; flipped.push({el:c,val:e}); sfx('jump');
                if(flipped.length===2) setTimeout(checkMatch, turbo?200:800);
            }
        }
        function checkMatch() {
            const [c1,c2] = flipped;
            if(c1.val===c2.val) { matched.push(c1.el,c2.el); c1.el.style.background='#0f0'; c2.el.style.background='#0f0'; sfx('win'); }
            else { c1.el.innerText=""; c1.el.style.background="#222"; c2.el.innerText=""; c2.el.style.background="#222"; }
            flipped=[];
        }
    </script>
</body>
</html>
